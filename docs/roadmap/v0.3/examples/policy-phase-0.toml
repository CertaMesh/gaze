[session]
scope = "persistent"
ttl_secs = 86400

[[detector]]
kind = "regex"
name = "emails"
pattern = '(?i)\b[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}\b'
class = "email"

[[detector]]
kind = "regex"
name = "german_ibans"
pattern = '\bDE\d{2}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{2}\b'
class = "custom:iban"

[[detector]]
kind = "regex"
name = "german_phone_numbers"
pattern = '(?x)\b(?:\+49|0)(?:[\s\-]?\d){7,14}\b'
class = "custom:german_phone"

[[rule]]
kind = "class"
class = "email"
action = "tokenize"

[[rule]]
kind = "class"
class = "custom:iban"
action = "tokenize"

[[rule]]
kind = "class"
class = "custom:german_phone"
action = "tokenize"

[[rule]]
kind = "default"
action = "preserve"
