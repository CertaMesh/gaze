# Anvil >= 1.13. Rustup proxies bind nested Cargo/trybuild/rustdoc children too.
env:
  RUSTUP_TOOLCHAIN: "1.96.0"
  PATH: "${HOME}/.cargo/bin:${PATH}"
  RUSTC: "${HOME}/.cargo/bin/rustc"
  RUSTDOC: "${HOME}/.cargo/bin/rustdoc"
  CARGO_BUILD_JOBS: "4"
  PYTHONDONTWRITEBYTECODE: "1"
# Keep Cargo's cwd-relative target/. Nested mutation gates rely on that layout.

components:
  - name: bench-python
    path: scripts/bench
    requires: [uv]
    override: true
    prepare:
      - run: uv sync --python 3.13 --locked --group comparison-test
        inputs: [pyproject.toml, uv.lock]
        outputs: [.venv/pyvenv.cfg]

# Optional, used in place. Consumers verify their SHA-pinned bundles on load.
resources:
  shared:
    - name: ner
      path: ~/.local/share/gaze/models/davlan-mbert-ner-hrl
      env: GAZE_NER_MODEL_DIR
      required: false
    - name: nym
      path: ~/.local/share/gaze/models/nym-small-int8
      env: GAZE_NYM_MODEL_DIR
      required: false
    - name: gliner-dob
      path: ~/.local/share/gaze/models/gliner-multi-pii-dob-int8
      required: false
    - name: opf
      path: ~/.opf/privacy_filter
      env: OPF_CHECKPOINT
      required: false

roles:
  review:
    env_unset:
      - CARGO_REGISTRY_TOKEN
      - CARGO_REGISTRIES_CRATES_IO_TOKEN
      - NPM_TOKEN
      - NODE_AUTH_TOKEN
      - PYPI_TOKEN
      - UV_PUBLISH_TOKEN

checks:
  invisible-focus:
    description: Adopter edge and overlap regressions before complete separator verification
    expensive: true
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/ci/invisible_separator_mutation_probe.py, anvil.yaml]
    toolchain: [rustc -Vv, cargo -V]
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo test -p gaze-recognizers --test legacy_source_boundaries
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo test -p gaze-recognizers --test validators hard_boundary_
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/ci/invisible_separator_mutation_probe.py --probe hard_boundary_containment --probe adopter_edge_literal
  invisible-separators:
    description: Unicode separator round trips, mapping mutations and affected-crate tests
    expensive: true
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/ci/invisible_separator_mutation_probe.py, scripts/ci/verify_normalize_merge.py, anvil.yaml]
    toolchain: [rustc -Vv, cargo -V]
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo fmt --all -- --check
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo clippy --workspace --all-features --all-targets -- -D warnings
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/ci/verify_normalize_merge.py
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/ci/invisible_separator_mutation_probe.py
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo test -p gaze-types -p gaze-pii -p gaze-recognizers --all-features
  invisible-release:
    description: Build the release CLI for invisible-separator equality and cold-start evidence
    expensive: true
    reusable: false
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, anvil.yaml]
    toolchain: [rustc -Vv, cargo -V]
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo build --release -p gaze-cli
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo test --release -p gaze-recognizers --features test-support --test source_regex_cold_work -- --nocapture
  fmt:
    reusable: true
    inputs: &rust-inputs [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/anvil, .github/workflows, anvil.yaml]
    toolchain: &rust-tools [rustc -Vv, rustdoc -V, cargo -V, cargo fmt --version, cargo clippy --version]
    commands:
      - cargo fmt --all -- --check
  clippy:
    reusable: true
    locks: [workspace-build]
    inputs: *rust-inputs
    toolchain: *rust-tools
    commands:
      - cargo clippy --workspace --all-features --all-targets -- -D warnings
  fast:
    description: Format and lint before full verification
    reusable: true
    locks: [workspace-build]
    inputs: *rust-inputs
    toolchain: *rust-tools
    commands:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-features --all-targets -- -D warnings
  test:
    description: Workspace tests, with at least one executed test
    expensive: true
    locks: [workspace-build]
    inputs: *rust-inputs
    toolchain: *rust-tools
    commands:
      - python3 -m unittest discover -s scripts/anvil -p 'test_test_*.py'
      - python3 scripts/anvil/test_nonempty.py cargo test --workspace --all-features
  feature-matrix:
    expensive: true
    locks: [workspace-build]
    inputs: *rust-inputs
    toolchain: *rust-tools
    commands:
      - cargo run -p xtask -- ci-feature-matrix
  bench-py:
    description: CI model-free benchmark Python tests
    expensive: true
    locks: [bench-machine, workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, crates, scripts/bench/*.py, scripts/bench/pyproject.toml, scripts/bench/uv.lock, scripts/ci, docs/reference/benchmarks, .github/workflows, anvil.yaml]
    toolchain: [rustc -Vv, cargo -V, uv --version, uv run --project scripts/bench --python 3.13 --group comparison-test python --version]
    commands:
      - uv run --project scripts/bench --python 3.13 --group comparison-test python -m pytest -q scripts/bench --durations=30

  keystore-isolation:
    description: Fake-backed guard mutations, index/audit tests, and full feature matrix
    expensive: true
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/anvil, scripts/gate/os-keystore-mutation-probe.py, scripts/ci/test-shards.json, scripts/bench/producer_build_binding.py, scripts/bench/test_producer_build_binding.py, docs/reference/benchmarks/evidence-protocol-v1.md, .github/workflows, anvil.yaml]
    toolchain: *rust-tools
    commands:
      - env CARGO_BUILD_JOBS=2 nice -n 10 python3 scripts/gate/os-keystore-mutation-probe.py --workspace

  keystore-cwd:
    description: Independent keystore guards, outside-cwd regression, focused tests and clippy
    expensive: true
    reusable: false
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/gate/os-keystore-mutation-probe.py, anvil.yaml]
    toolchain: *rust-tools
    commands:
      - cargo fmt --all -- --check
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/gate/os-keystore-mutation-probe.py --focused

  audit-outcomes-test:
    description: Workspace all-features tests for audit outcome changes
    expensive: true
    locks: [workspace-build]
    inputs: *rust-inputs
    toolchain: *rust-tools
    identity_env: [CARGO_PROFILE_DEV_DEBUG, CARGO_PROFILE_TEST_DEBUG, CARGO_INCREMENTAL, GAZE_DISABLE_OS_KEYSTORE]
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/anvil/test_nonempty.py cargo test --workspace --all-features
  audit-outcomes-lint:
    description: Format and lint audit outcome changes with two build jobs
    locks: [workspace-build]
    inputs: *rust-inputs
    toolchain: *rust-tools
    identity_env: [CARGO_PROFILE_DEV_DEBUG, CARGO_PROFILE_TEST_DEBUG, CARGO_INCREMENTAL, GAZE_DISABLE_OS_KEYSTORE]
    commands:
      - cargo fmt --all -- --check
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo clippy --workspace --all-features --all-targets -- -D warnings
  audit-outcomes-isolation:
    description: Metadata and Dylint audit isolation gates
    expensive: true
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, lint/dylint, dylint.toml, anvil.yaml]
    toolchain: *rust-tools
    identity_env: [CARGO_PROFILE_DEV_DEBUG, CARGO_PROFILE_TEST_DEBUG, CARGO_INCREMENTAL, GAZE_DISABLE_OS_KEYSTORE]
    commands:
      - env CARGO_BUILD_JOBS=2 nice -n 10 cargo run -p xtask --locked -- cargo-metadata-audit-isolation
      - env CARGO_BUILD_JOBS=2 nice -n 10 cargo run -p xtask --locked -- dylint-gate

  mcp-host-echo:
    description: Host-context normalization, joins, argument budgets and boundary mutations
    expensive: true
    reusable: false
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/gate/mcp-host-context-mutation-probe.py, anvil.yaml]
    toolchain: *rust-tools
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/gate/mcp-host-context-mutation-probe.py --run --probe rebuild-context-pipeline --probe duplicate-views --probe normalization-drift --probe split-argument-echo --probe argument-budget --probe argument-scalars --probe argument-entries --probe guess-preparation --probe guess-case-mode --probe guess-allowed-kinds --probe guess-boundaries --probe folded-boundary-view --probe guess-whitespace

  mcp-host-release:
    identity_env: [GAZE_CLEAN_BASE_WORKTREE]
    description: Release binaries for clean equality and synthetic MCP measurements
    expensive: true
    reusable: false
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/verification/build_clean_equality_base.py, scripts/anvil, .github/workflows, anvil.yaml]
    toolchain: *rust-tools
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo build --locked --release -p gaze-cli --features mcp
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo build --locked --release -p gaze-mcp-rmcp --example host_context_measure
      - python3 scripts/verification/build_clean_equality_base.py

  mcp-host-ci:
    description: Reproduce host-context CI failures and verify cached dispatch
    expensive: true
    reusable: false
    locks: [workspace-build]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/ci, scripts/bench/validator_recall_probe, scripts/bench/gaze_bench_score.py, anvil.yaml]
    toolchain: *rust-tools
    commands:
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo test --locked -p gaze-mcp-core --lib
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo test --locked -p gaze-mcp-core --test strict_contract
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/ci/validator_probe_gate.py
      - env CARGO_BUILD_JOBS=2 GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 cargo run -p xtask -- ci-feature-matrix --partition ci-gates

  mcp-host-measure:
    description: Five-run release MCP latency and peak RSS capture
    expensive: true
    reusable: false
    locks: [workspace-build, bench-machine]
    inputs: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo, crates, scripts/measure_mcp_host_context.py, anvil.yaml]
    toolchain: *rust-tools
    commands:
      - env GAZE_DISABLE_OS_KEYSTORE=1 nice -n 10 python3 scripts/measure_mcp_host_context.py --cli-bin target/release/gaze --host-bin target/release/examples/host_context_measure --output target/gate/mcp-host-latency-rss.json --reference-host-bin target/gate/mcp-host-before-cache/host_context_measure --reference-source-sha f9f79848e6e6f4837821862801a4a795714e1547
