# cargo-about configuration for the third-party licence file shipped with
# release binaries. Keep `accepted` in step with [licenses] in deny.toml, and
# `targets` in step with the build matrix in .github/workflows/release.yml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# deny.toml allows MPL-2.0 only for this crate.
[option-ext]
accepted = ["MPL-2.0"]
