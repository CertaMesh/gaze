[package]
name = "gaze-proxy-dashboard"
version = "0.12.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Isolated, memory-only inspection dashboard runtime for Gaze proxy workflows"
repository = "https://github.com/CertaMesh/gaze"

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
gaze-inspection = { path = "../gaze-inspection", version = "0.12.0" }
gaze-types = { path = "../gaze-types", version = "0.12.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
static_assertions = "1.1.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
