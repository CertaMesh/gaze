[package]
name = "ghostwriter"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Deterministic text sanitization and exact-token restoration for LLM prompts"

[lib]
name = "ghostwriter"
path = "src/lib.rs"

[[bin]]
name = "ghostwriter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
gaze = { path = "../gaze" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
