[package]
name = "gaze-document"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/EmpireTwo/gaze"
homepage = "https://github.com/EmpireTwo/gaze"
description = "OSS document ingestion + safe-bundle generation for the Gaze runtime"
readme = "README.md"
keywords = ["pii", "gaze", "document", "ocr", "bundle"]
categories = ["text-processing"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "gaze_document"
path = "src/lib.rs"

[dependencies]
gaze = { path = "../gaze", version = "0.7.0", package = "gaze-pii" }

[features]
default = []
ocr-tesseract = []
extract-docling = []
render-image = []
