[package]
name = "xtask"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fake = "2.10"
gaze = { path = "../gaze", package = "gaze-pii" }
gaze-recognizers = { path = "../gaze-recognizers" }
phonenumber = { version = "0.3.9", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
