[package]
name = "xtask"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gaze = { path = "../gaze" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
