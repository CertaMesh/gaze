[package]
name = "gaze-cli"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Gaze command-line interface"

[[bin]]
name = "gaze"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
gaze = { path = "../gaze" }
gaze-assembly = { path = "../gaze-assembly" }
gaze-audit = { workspace = true }
gaze-recognizers = { path = "../gaze-recognizers" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22"
gaze-audit = { workspace = true }
gaze-recognizers = { path = "../gaze-recognizers", features = ["test-support"] }
rusqlite = { workspace = true }
serde_json = "1"
tempfile = "3"
