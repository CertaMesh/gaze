[package]
name = "gaze-cli"
version = "0.12.0"
edition = "2021"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Gaze command-line interface"
readme = "README.md"
keywords = ["pii", "gaze", "cli"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["proxy", "setup"]
setup = ["dep:gaze-model-setup", "safety-net-kiji"]
safety-net-openai = ["gaze-recognizers/safety-net-openai"]
safety-net-kiji = ["gaze-recognizers/safety-net-kiji"]
runtime-tract = ["safety-net-kiji", "gaze-recognizers/runtime-tract"]
runtime-candle = ["safety-net-kiji", "gaze-recognizers/runtime-candle"]
document = ["dep:gaze-document"]
index = ["dep:gaze-token-bridge", "safety-net-kiji"]
mcp = [
    "dep:async-trait",
    "dep:directories-next",
    "dep:gaze-mcp-bridge",
    "dep:gaze-mcp-core",
    "dep:gaze-mcp-rmcp",
    "dep:pdfium-render",
    "dep:tokio",
    "document",
    "gaze-document/mcp",
]
proxy = ["dep:gaze-proxy", "dep:tokio"]
dashboard = ["proxy", "dep:gaze-proxy-dashboard", "dep:getrandom"]

[[bin]]
name = "gaze"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
async-trait = { version = "0.1", optional = true }
directories-next = { version = "2", optional = true }
gaze = { path = "../gaze", version = "0.12.0", package = "gaze-pii" }
gaze-assembly = { path = "../gaze-assembly", version = "0.12.0" }
gaze-audit = { workspace = true }
gaze-document = { path = "../gaze-document", version = "0.12.0", optional = true }
gaze-mcp-bridge = { workspace = true, optional = true }
gaze-mcp-core = { path = "../gaze-mcp-core", version = "0.12.0", optional = true }
gaze-mcp-rmcp = { path = "../gaze-mcp-rmcp", version = "0.12.0", optional = true }
gaze-model-setup = { workspace = true, optional = true }
gaze-proxy = { workspace = true, optional = true }
gaze-proxy-dashboard = { workspace = true, optional = true }
gaze-recognizers = { path = "../gaze-recognizers", version = "0.12.0" }
gaze-token-bridge = { path = "../gaze-token-bridge", version = "0.12.0", optional = true }
gaze-types = { workspace = true }
getrandom = { version = "0.3", optional = true }
pdfium-render = { version = "0.9", optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tracing = "0.1"
url = "2"

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22"
gaze-audit = { workspace = true }
gaze-recognizers = { path = "../gaze-recognizers", version = "0.12.0", features = ["test-support"] }
rusqlite = { workspace = true }
serde_json = "1"
tempfile = "3"
