[package]
name = "gaze-cli"
version = "0.6.6"
edition = "2021"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Gaze command-line interface"
readme = "README.md"
keywords = ["pii", "gaze", "cli"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
safety-net-openai = ["gaze-recognizers/safety-net-openai"]

[[bin]]
name = "gaze"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
gaze = { path = "../gaze", version = "0.6.6", package = "gaze-pii" }
gaze-assembly = { path = "../gaze-assembly", version = "0.6.6" }
gaze-audit = { workspace = true }
gaze-recognizers = { path = "../gaze-recognizers", version = "0.6.6" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22"
gaze-audit = { workspace = true }
gaze-recognizers = { path = "../gaze-recognizers", version = "0.6.6", features = ["test-support"] }
rusqlite = { workspace = true }
serde_json = "1"
tempfile = "3"
