[package]
name = "gaze-pii"
version = "0.17.0"
edition = "2021"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reversible PII pseudonymization runtime for agentic workflows"
readme = "README.md"
keywords = ["pii", "pseudonymization", "gdpr", "redaction", "agents"]
categories = ["text-processing", "cryptography"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "gaze"
path = "src/lib.rs"

[features]
perf-timers = ["gaze-types/perf-timers", "gaze-recognizers?/perf-timers"]
default = ["bundled-recognizers"]
bundled-recognizers = ["dep:gaze-recognizers"]
safety-net = ["gaze-recognizers/safety-net"]
test-support = []

[dependencies]
aho-corasick = "1"
anyhow = "1"
base64 = "0.22"
dashmap = "6"
ed25519-dalek = "2"
gaze-recognizers = { path = "../gaze-recognizers", version = "0.17.0", optional = true }
gaze-types = { workspace = true }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rand = "0.8"
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
gaze-audit = { workspace = true }
proptest = "1"
pulldown-cmark = { version = "=0.13.4", default-features = false }
rusqlite = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"

[[bench]]
name = "pipeline_end_to_end"
harness = false

[[bench]]
name = "tier4_pipeline_gating"
harness = false
