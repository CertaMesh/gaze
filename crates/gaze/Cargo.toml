[package]
name = "gaze"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
build = "build.rs"
license = "Apache-2.0"
description = "Channel-agnostic GDPR-compliant redaction engine"

[lib]
name = "gaze"
path = "src/lib.rs"

[dependencies]
dashmap = "6"
ed25519-dalek = "2"
hex = "0.4"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-rustls"] }
ndarray = "0.16"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"
