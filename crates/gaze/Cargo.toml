[package]
name = "gaze"
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
build = "build.rs"
license = "Apache-2.0"
description = "Channel-agnostic GDPR-compliant redaction engine"

[lib]
name = "gaze"
path = "src/lib.rs"

[features]
default = ["bundled-recognizers"]
audit = ["dep:gaze-audit"]
bundled-recognizers = ["dep:gaze-recognizers"]
safety-net = []

[dependencies]
anyhow = "1"
base64 = "0.22"
dashmap = "6"
ed25519-dalek = "2"
gaze-audit = { workspace = true, optional = true }
gaze-recognizers = { path = "../gaze-recognizers", optional = true }
gaze-types = { workspace = true }
hex = "0.4"
libc = "0.2"
rand = "0.8"
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
unicode-normalization = "0.1"
zeroize = "1"

[dev-dependencies]
gaze-audit = { workspace = true }
rusqlite = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"
