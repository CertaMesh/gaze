[package]
name = "gaze-recognizers"
version = "0.4.6"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Built-in recognizers for Gaze"

[features]
# phone-parser feature gates phonenumber dep; default-on for gaze-cli, default-off for raw lib.
default = ["phone-parser"]
phone-parser = ["dep:phonenumber"]
test-support = []

[dependencies]
aho-corasick = "1"
gaze-types = { workspace = true }
hex = "0.4"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-rustls"] }
phonenumber = { version = "0.3.9", default-features = false, optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
criterion = "0.5"
gaze = { path = "../gaze" }
tempfile = "3"

[[bench]]
name = "dictionary"
harness = false

[[bench]]
name = "restore_pass2"
harness = false
