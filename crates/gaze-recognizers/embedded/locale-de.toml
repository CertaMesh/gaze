schema_version = "0.1.0"
rulepack_id = "gaze-locale-de"
rulepack_version = "0.5.1"
default_locales = ["de-DE", "de-AT", "de-CH"]

# Phase 2 ports DACH structured recognizers.
[locale.email_headers]
names = ["Von", "An", "Cc", "Bcc", "Antwort-An", "Absender"]

[locale.forward_markers]
names = ["Weitergeleitete Nachricht von", "Forwarded message from", "Begin forwarded message from", "----- Forwarded message"]

[locale.agent_recipient_cues]
names = ["antwortest", "antworte", "schreibst", "reply to", "respond to", "draft for", "draft to"]

[locale.footer_cues]
names = ["Gesendet von", "Gesendet durch", "Sent by", "Sent via", "On behalf of", "via"]

[locale.cues.iban]
names = ["IBAN", "IBAN:", "Konto", "Kontonummer", "Bankverbindung"]
window_chars = 64

[locale.cues.passport]
names = ["Reisepass", "Reisepass-Nr", "Pass-Nr", "Passnummer"]
window_chars = 64

[locale.cues.codice-fiscale]
names = ["Codice fiscale", "Codice Fiscale", "C.F.", "CF"]
window_chars = 64

[locale.cues.vat-id]
names = ["USt-IdNr", "USt-ID", "Umsatzsteuer-ID", "MwSt-Nr"]
window_chars = 64
