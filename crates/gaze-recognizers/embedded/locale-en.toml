schema_version = "0.1.0"
rulepack_id = "gaze-locale-en"
rulepack_version = "0.5.1"
default_locales = ["en-US", "en-GB", "en-IE", "en-AU", "en-CA"]

# Phase 2 ports English locale recognizers.
[locale.email_headers]
names = ["From", "To", "Cc", "Bcc", "Reply-To", "Sender"]

[locale.forward_markers]
names = ["Forwarded message from", "Begin forwarded message", "----- Forwarded message"]

[locale.agent_recipient_cues]
names = ["reply to", "respond to", "draft for", "draft to"]

[locale.footer_cues]
names = ["Sent by", "Sent via", "On behalf of"]

[locale.cues.iban]
names = ["IBAN", "IBAN:", "Account", "Account No.", "Bank account"]
window_chars = 64

[locale.cues.passport]
names = ["Passport", "Passport:", "Passport No.", "Passport number"]
window_chars = 64

[locale.cues.vat-id]
names = ["VAT", "VAT:", "VAT no", "VAT ID", "VAT number"]
window_chars = 64

[locale.cues.ssn]
names = ["SSN", "Social Security", "Social Security Number", "SS#"]
window_chars = 64
