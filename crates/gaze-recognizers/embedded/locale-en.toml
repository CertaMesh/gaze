schema_version = "0.1.0"
rulepack_id = "gaze-locale-en"
rulepack_version = "0.5.1"
default_locales = ["en-US", "en-GB", "en-IE", "en-AU", "en-CA"]

# Phase 2 ports English locale recognizers.
# Street-type words that let a NER location span license the house number
# written before it (`17 Example Street`). The word must end a multi-word NER
# location span; a trailing dot marks an abbreviation.
[locale.street_types_number_before]
names = ["street", "st.", "road", "rd.", "avenue", "ave.", "drive", "dr.", "lane", "ln.", "boulevard", "blvd.", "court", "ct.", "crescent", "close", "way", "place", "pl.", "terrace", "parkway", "square", "sq.", "highway", "hwy.", "grove", "gardens", "mews"]

# Address words an already protected address part (postcode, NER street or
# city, house number) may grow over when written right beside it (todo 4013).
# Unit designators are followed by a unit number (`Suite 312`, `Apt. 4B`,
# `PO Box 417`, the military `PSC 806`); a trailing dot marks an abbreviation.
# A designator with no protected address beside it is never tokenized.
[locale.address_unit_designators]
names = ["suite", "ste", "ste.", "apartment", "apt", "apt.", "unit", "flat", "floor", "fl.", "po box", "p.o. box", "psc", "cmr"]

# Exact-case state codes between a city and its ZIP (`IL 00068`), and the
# military state codes of APO/FPO/DPO mail. Grown only in front of a number.
[locale.address_region_codes]
names = ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY", "PR", "AA", "AE", "AP"]

# Military post offices, exact case (`APO AE 09012`).
[locale.address_military_post_offices]
names = ["APO", "FPO", "DPO"]

[locale.email_headers]
names = ["From", "To", "Cc", "Bcc", "Reply-To", "Sender"]

[locale.forward_markers]
names = ["Forwarded message from", "Begin forwarded message", "----- Forwarded message"]

[locale.agent_recipient_cues]
names = ["reply to", "respond to", "draft for", "draft to"]

[locale.footer_cues]
names = ["Sent by", "Sent via", "On behalf of"]

[locale.cues.iban]
names = ["IBAN", "IBAN:", "Account", "Account No.", "Bank account"]
window_chars = 64

[locale.cues.passport]
names = ["Passport", "Passport:", "Passport No.", "Passport number"]
window_chars = 64

[locale.cues.vat-id]
names = ["VAT", "VAT:", "VAT no", "VAT ID", "VAT number"]
window_chars = 64

[locale.cues.ssn]
names = ["SSN", "Social Security", "Social Security Number", "SS#"]
window_chars = 64
