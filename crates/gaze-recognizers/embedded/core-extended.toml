schema_version = "0.1.0"
rulepack_id = "gaze-core-extended"
rulepack_version = "0.4.5"
default_locales = ["en-US", "de-DE", "de-AT", "de-CH", "global"]

[[recognizers]]
id = "phone.structural"
class = "custom:phone"
cooperates_with = ["phone.national.de", "phone.national.us"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\+\d{6,15}\b'''

[recognizers.validator]
kind = "e164_phone"

[recognizers.scoring]
base = 0.70
priority = 80

[recognizers.token]

[[recognizers]]
id = "phone.national.de"
class = "custom:phone"
cooperates_with = ["phone.structural", "phone.national.us"]
enabled = true
locales = ["de-DE", "de-AT", "de-CH"]

[recognizers.match]
kind = "regex"
pattern = '''(?x)(?:\+49[\s.-]*|0)(?:30|40|69|89|221|711|151)[\s.-]*(?:\d[\s.-]*){6,8}\d\b'''

[recognizers.validator]
kind = "e164_phone_national_de"

[recognizers.scoring]
base = 0.82
priority = 85

[recognizers.token]

[[recognizers]]
id = "phone.national.us"
class = "custom:phone"
cooperates_with = ["phone.structural", "phone.national.de"]
enabled = true
locales = ["en-US"]

[recognizers.match]
kind = "regex"
pattern = '''(?x)(?:\+?1[\s.-]+555[\s.-]*01\d{2}|\+?1[\s.-]+(?:\([2-9]\d{2}\)|[2-9]\d{2})[\s.-]*[2-9]\d{2}[\s.-]*\d{4}|\([2-9]\d{2}\)[\s.-]*[2-9]\d{2}[\s.-]*\d{4}|[2-9]\d{2}[\s.-]+[2-9]\d{2}[\s.-]+\d{4}|555[\s.-]*01\d{2})\b'''

[recognizers.validator]
kind = "e164_phone_national_us"

[recognizers.scoring]
base = 0.82
priority = 85

[recognizers.token]

[[recognizers]]
id = "iban.structural"
class = "custom:iban"
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
# Allows internal whitespace; iban_canonical normalizer strips before mod-97 validation.
pattern = '''\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]{4}){2,7} ?[A-Z0-9]{1,4}\b'''

[recognizers.validator]
kind = "iban_mod97"

[recognizers.normalizer]
kind = "iban_canonical"

[recognizers.scoring]
base = 0.70
priority = 80

[recognizers.token]

[[recognizers]]
id = "card.structural"
class = "custom:credit_card"
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b\d(?:[\s-]?\d){12,18}\b'''

[recognizers.validator]
kind = "luhn"

[recognizers.scoring]
base = 0.70
priority = 80

[recognizers.token]

[[recognizers]]
id = "ip.v4"
class = "custom:ip_address"
cooperates_with = ["ip.v6"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'''

[recognizers.scoring]
base = 0.70
priority = 80

[recognizers.token]

[[recognizers]]
id = "ip.v6"
class = "custom:ip_address"
cooperates_with = ["ip.v4"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''(?i)(?:^|[^0-9a-f:])((?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,7}:|(?:[0-9a-f]{1,4}:){1,6}:[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,5}(?::[0-9a-f]{1,4}){1,2}|(?:[0-9a-f]{1,4}:){1,4}(?::[0-9a-f]{1,4}){1,3}|(?:[0-9a-f]{1,4}:){1,3}(?::[0-9a-f]{1,4}){1,4}|(?:[0-9a-f]{1,4}:){1,2}(?::[0-9a-f]{1,4}){1,5}|[0-9a-f]{1,4}:(?:(?::[0-9a-f]{1,4}){1,6})|::(?:[0-9a-f]{1,4}:){0,6}[0-9a-f]{1,4}|::)(?:$|[^0-9a-f:])'''
capture_groups = [1]

[recognizers.scoring]
base = 0.70
priority = 80

[recognizers.token]

[[recognizers]]
id = "postal.de"
class = "custom:postal_code"
cooperates_with = ["postal.us"]
enabled = true
locales = ["de-DE"]

[recognizers.match]
kind = "regex"
pattern = '''\b\d{5}\b'''

[recognizers.scoring]
base = 0.70
priority = 70

[recognizers.token]

[[recognizers]]
id = "postal.us"
class = "custom:postal_code"
cooperates_with = ["postal.de"]
enabled = true
locales = ["en-US"]

[recognizers.match]
kind = "regex"
pattern = '''\b\d{5}(-\d{4})?\b'''

[recognizers.scoring]
base = 0.70
priority = 70

[recognizers.token]
