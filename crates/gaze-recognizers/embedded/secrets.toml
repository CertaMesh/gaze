schema_version = "0.1.0"
rulepack_id = "gaze-secrets"
rulepack_version = "0.3.0"
default_locales = ["global"]

# Credential rulepack. `gaze setup` includes it in the generated policy so
# credentials are protected by default. Library callers that assemble packs
# directly can load it with `[policy.rulepacks] bundled = ["core", "secrets"]`
# or `gaze clean --rulepack-bundled core,secrets`. The original two recognizers moved here
# from `core` 0.5.3. Hash and code-field rules extend this bundle.

# SECURITYTOKEN detection. Measured over the EN/DE holdout, the label carries 219 gold spans and
# 4,342 bytes, and the deterministic rule floor covered NONE of it before this change
# (fully_covered 0 AND overlapped 0).
#
# Why nothing unanchored: the committed A4 negative corpus is purpose-built to punish naive
# high-entropy rules. Across its 1,024 documents, an unanchored base64url run of >=20 chars
# matches 448 times in 320 documents (code_log_syntax 128, commerce_identifiers 128,
# unicode_mixed_language 64); unanchored hex >=32 matches in 128 documents; a bare UUID matches
# in 128 documents. Both arms below match ZERO A4 documents.
#
# Why no validator: the built-in `ValidatorKind` set covers email, phone, payment, network, and
# government-ID shapes, but none applies to a bearer credential. Validator-backed matching is
# therefore unavailable here rather than skipped. Structural evidence carries the whole burden,
# which is why each arm requires a fixed issuer prefix, a decodable structure, or an explicit
# lexical cue.
#
# The anchored and bare rules cooperate with code-field ownership. Exact-span
# agreement retains each source ID in the protection trace; strict same-class
# containment keeps a whole field or private-key block ahead of inner matches.
#
# `locales = ["global"]` with the German cues carried as literal pattern alternatives rather than
# `[locale.cues.*]` bundle lookups, so this fires on every locale chain including the one a default
# adopter gets. A locale-gated credential rule that silently never fires is the failure mode behind
# the locale-chain fix.
[[recognizers]]
id = "security_token.anchored"
safety_tier = "safe_default"
class = "custom:security_token"
enabled = true
locales = ["global"]
locale_basis = "document"

[recognizers.match]
kind = "regex"
# Arm 1 (group 1), case-SENSITIVE via `(?-i:...)`: provider-prefixed and structurally-typed
# credentials. `AKIA` alone accounts for 78 of the 219 gold spans (35.6%) and is the dominant
# character-class silhouette in the corpus (U12dU7, 73 spans). `ASIA` is the AWS
# temporary-credential sibling of the same fixed 4 + 16 shape: zero occurrences in this corpus, so
# it contributes nothing to the benchmark number, but omitting it would ship a rule that catches
# permanent AWS keys and silently misses temporary ones. Included on axis-1 grounds at zero
# measured corpus cost, and disclosed as such rather than counted as coverage.
#
# On the JWT alternative: `eyJ` is NOT a vendor prefix. It is the base64url encoding of the two
# bytes `{"`, so requiring it is equivalent to requiring that the first segment decodes to a JSON
# object whose first key is a string -- the JOSE header. With the mandatory three dot-separated
# base64url segments this matches RFC 7519 structure rather than a brand, which is as close to
# validator-backed matching as the built-in `ValidatorKind` set permits for a credential.
#
# Arm 2 (group 2), case-insensitive: cue-anchored credentials. This is the inverse of the URL
# finding and the reason it is safe here: 193 of 219 gold spans (88.1%) have "token" or "secret"
# in the preceding 64 characters, where only 1.8% of gold URL spans carry their proposed cues.
# The immediate shipping grammar is narrower: 126 spans have a supported cue directly before the
# value, and 113 of those meet the >=14 value shape. All 193 broad cue-context spans contain a
# delimiter other than `_` or `-`; zero abut their cue and zero use a direct hyphen as their only
# delimiter. Requiring a real delimiter therefore keeps the 113 value-eligible gold spans.
#
# A direct `cue-credential` form is deliberately rejected: `-` is both plausible punctuation and
# a legal credential/identifier character, and the holdout contains zero direct-hyphen-only gold
# gaps. A spaced `cue - credential` form remains accepted because the whitespace is the required
# unambiguous delimiter. The cue makes a high-entropy run attributable; without it the same run is
# indistinguishable from the commit hashes, order identifiers, and log payloads the A4 negatives
# are full of. Only the credential is captured, so the cue and delimiter stay in the clean text.
#
# The >=14 minimum length is a measured knee, not a round number. Over the holdout, with arm 1 also
# active: >=20 covers 101 spans at 0 non-gold matches, >=16 covers 141 at 1, >=14 covers 151
# (3,084 of 4,342 gold bytes, 71.0%) at 1, >=12 covers 159 at 5, and >=10 covers 163 at 7.
# Relaxing from 14 to 10 buys 139 further bytes for six additional non-gold matches, so 14 is where
# coverage stops paying for itself.
# The cue starts before the JWT, so its arm wins even if the bare arm is first.
# Try the complete JWT inside group 2 before an opaque run. Preserve the original
# ASCII word-boundary protection beside dotted/hyphenated context; rejecting such
# context would expose claims that the bare arm previously protected. A consumed
# separator remains outside the value, and scanning resumes at the capture end.
# Prefer the unwrapped JWT so its JSON payload cannot be mistaken for a second
# header after a greedy prefix, swallowing a dotted sentence tail. The prefix
# run is lazy too, so a wrapped JWT keeps that same boundary before a dotted tail.
pattern = '''(?i)(?:(?-i:(?-u:\b)((?:AKIA|ASIA)[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,})(?:(?-u:\b)|\z|[^A-Za-z0-9_-]))|(?-u:\b)(?:security[ _-]?token|sicherheitstoken|zugangstoken|zugangsschl[uü]ssel|api[ _-]?key|access[ _-]?token|auth(?:orization)?[ _-]?token|bearer|token)(?:[ \t]{1,4}(?:(?:ist|lautet|is)[ \t]{1,4})?(?:[:=#-][ \t]{0,4})?|[ \t]{0,4}[:=#][ \t]{0,4})((?-i:(?:[A-Za-z0-9_-]+?[-.])??eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,})|[A-Za-z0-9_-]{14,})(?:(?-u:\b)|\z|[^A-Za-z0-9_-]))'''
capture_groups = [1, 2]

[recognizers.scoring]
# Above the 0.70 heuristic floor: every match carries either a fixed issuer prefix, a decodable
# JOSE structure, or an explicit lexical cue. Priority stays below `email.global` (90) so an
# address is never absorbed into a credential span.
base = 0.85
priority = 87

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"

# Explicit EN/DE field records. Capture values only; no semantic validity claim.
# Multiline start anchors plus a single trailing LF/CRLF/EOF boundary keep
# consecutive records independent; a bare CR is not a record boundary.
# Credential values: 1..256 normalized grammar units, plain scalar or escaped
# matching quote/backslash. Require the full closing quote and record boundary.
# The pipeline removes joiners before matching, so this is NOT a raw-size bound
# or protection of removed edge joiners. Source spelling is never unescaped.
# Priority 100 exceeds embedded custom substrings (maximum 87); builtin exact,
# partial and containing spans still follow existing arbitration and caller policy.

[[recognizers]]
id = "password.field"
safety_tier = "safe_default"
class = "custom:password"
enabled = true
locales = ["global"]
locale_basis = "document"

[recognizers.match]
kind = "regex"
pattern = '''(?im)^[ \t]*(?:password|passphrase|passwort|kennwort)[ \t]*[:=][ \t]*(?:"((?:[^"\\\r\n]|\\["\\]){1,256})"|'((?:[^'\\\r\n]|\\['\\]){1,256})'|([^\s"'\\]{1,256}))[ \t]*(?:\r?\n|\z)'''
capture_groups = [1, 2, 3]

[recognizers.scoring]
base = 0.90
priority = 100

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"

# Whole password encodings; no field cue and no cryptographic validity claim.
# Prefix/component grammar follows libxcrypt crypt(5), Passlib scrypt, PHC
# Argon2 v19 and Django hashers. Variable PHC components are not truncated.
# SQL quote escapes and JSON escaped slashes count as one producer character.
# Keep the complete serialized source in the capture for exact restoration.
# Only an escaped slash continues a hash alphabet; valid JSON separator escapes
# separate complete hashes on either side. Reject glued identifiers and malformed escapes.
[[recognizers]]
id = "password.hash"
safety_tier = "safe_default"
class = "custom:password"
enabled = true
locales = ["global"]
locale_basis = "format"
cooperates_with = ["password.field", "password.code"]

[recognizers.match]
kind = "regex"
pattern = '''(?x)(?:\A|[^A-Za-z0-9_./+$\\-]|\\(?:[ntrbf"\\]|u[0-9A-Fa-f]{4}))(
    (?:(?:bcrypt_sha256|bcrypt)\$)?\$2[abxy]\$[0-9]{2}\$(?:[.A-Za-z0-9/]|\\/){53}
  | (?:argon2)?\$argon2(?:id|i|d)\$v=19\$m=[0-9]{1,10},t=[0-9]{1,10},p=[0-9]{1,10}\$(?:[A-Za-z0-9+/]|\\/){4,}\$(?:[A-Za-z0-9+/]|\\/){4,}
  | \$scrypt\$ln=[0-9]{1,2},r=[0-9]{1,10},p=[0-9]{1,10}\$(?:[A-Za-z0-9+/]|\\/){0,1366}\$(?:[A-Za-z0-9+/]|\\/){43}
  | \$7\$(?:[.A-Za-z0-9/]|\\/){11,97}\$(?:[.A-Za-z0-9/]|\\/){43}
  | \$y\$(?:[.A-Za-z0-9/]|\\/)+\$(?:[.A-Za-z0-9/]|\\/){0,86}\$(?:[.A-Za-z0-9/]|\\/){43}
  | \$5\$(?:rounds=[0-9]{1,9}\$)?(?:''|\\'|[^$:\n\x00]){0,16}\$(?:[.A-Za-z0-9/]|\\/){43}
  | \$6\$(?:rounds=[0-9]{1,9}\$)?(?:''|\\'|[^$:\n\x00]){0,16}\$(?:[.A-Za-z0-9/]|\\/){86}
  | \$1\$(?:''|\\'|[^$:\n\x00]){0,8}\$(?:[.A-Za-z0-9/]|\\/){22}
  | \$[PH]\$(?:[.A-Za-z0-9/]|\\/){31}
  | pbkdf2_sha256\$[0-9]{1,10}\$[^$]+\$(?:[A-Za-z0-9+/]|\\/){43}=
  | pbkdf2_sha1\$[0-9]{1,10}\$[^$]+\$(?:[A-Za-z0-9+/]|\\/){27}=
  | scrypt\$[0-9]{1,10}\$[^$]+\$[0-9]{1,10}\$[0-9]{1,10}\$(?:[A-Za-z0-9+/]|\\/){86}==
)(?:\z|[^A-Za-z0-9_./+$=\\-]|\\(?:[ntrbf"\\]|u[0-9A-Fa-f]{4}))'''
capture_groups = [1]

[recognizers.scoring]
base = 0.95
priority = 100

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"

# Code fields own complete quoted literal contents, including source escapes.
# Never scan expressions or infer SQL positional ownership. Hash values in SQL
# are protected by password.hash. Bare password keys require code punctuation;
# password.field keeps ownership of its existing line-record grammar.
[[recognizers]]
id = "password.code"
safety_tier = "safe_default"
class = "custom:password"
enabled = true
locales = ["global"]
locale_basis = "document"
cooperates_with = ["password.field", "password.hash"]

[recognizers.match]
kind = "regex"
pattern = '''(?ix)(?:\A|[\s{\[(,;])(?:
    (?:"(?:password|passphrase|passwort|kennwort)"|'(?:password|passphrase|passwort|kennwort)')
    [\x20\t]*(?:=>|:|=)[\x20\t]*
    (?:"((?:[^"\\\r\n]|\\[^\r\n])+)"|'((?:[^'\\\r\n]|\\[^\r\n])+)')
    [\x20\t]*(?:[,;})\]]|\r?\n|\z)
  | (?:password|passphrase|passwort|kennwort)
    [\x20\t]*(?:=>|:|=)[\x20\t]*
    (?:"((?:[^"\\\r\n]|\\[^\r\n])+)"|'((?:[^'\\\r\n]|\\[^\r\n])+)')
    [\x20\t]*[,;})\]]
)'''
capture_groups = [1, 2, 3, 4]

[recognizers.scoring]
base = 0.90
priority = 100

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"

[[recognizers]]
id = "security_token.code"
safety_tier = "safe_default"
class = "custom:security_token"
enabled = true
locales = ["global"]
locale_basis = "document"
cooperates_with = ["security_token.anchored"]

[recognizers.match]
kind = "regex"
pattern = '''(?i)(?:\A|[\s{\[(,;])(?:"(?:api_token|remember_token|security_token|access_token|auth_token|authorization_token|api_key)"|'(?:api_token|remember_token|security_token|access_token|auth_token|authorization_token|api_key)'|(?:api_token|remember_token|security_token|access_token|auth_token|authorization_token|api_key))[ \t]*(?:=>|:|=)[ \t]*(?:"((?:[^"\\\r\n]|\\[^\r\n])+)"|'((?:[^'\\\r\n]|\\[^\r\n])+)')[ \t]*(?:[,;})\]]|\r?\n|\z)'''
capture_groups = [1, 2]

[recognizers.scoring]
base = 0.90
priority = 100

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"

# Issuer prefixes provide attribution without a cue; arbitrary entropy does not.
# Issuer shapes and minimum widths are documented in the class reference.
# Distinctive prefixes may occur inside identifiers; generic sk- needs a leading
# ASCII/serialized boundary. Suffixes have no upper bound and include hyphens.
[[recognizers]]
id = "security_token.bare"
safety_tier = "safe_default"
class = "custom:security_token"
enabled = true
locales = ["global"]
locale_basis = "format"
cooperates_with = ["security_token.anchored", "security_token.code", "security_token.pem"]

[recognizers.match]
kind = "regex"
pattern = '''(?x)(?:(
    ghs_[A-Za-z0-9_-]+?_eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}
  | gh[pour]_[A-Za-z0-9_-]{36,}
  | github_pat_[A-Za-z0-9_-]{82,}
  | sk-(?:proj|svcacct|admin|None|ant)-[A-Za-z0-9_-]{32,}
  | (?:xox[abprs]|xapp|xoxe(?:\.xoxp)?)-[A-Za-z0-9][A-Za-z0-9-]{9,}
  | [sr]k_(?:live|test)_[A-Za-z0-9_-]{24,}
  | whsec_[A-Za-z0-9_-]{24,}
  | AIza[A-Za-z0-9_-]{35,}
)(?:\z|[^A-Za-z0-9_\\-]|\\(?:[ntrbf"\\]|u[0-9A-Fa-f]{4})|%[0-9A-Fa-f]{2})
  | (?:\A|[^A-Za-z0-9_\\-]|\\(?:[ntrbf"\\]|u[0-9A-Fa-f]{4})|%[0-9A-Fa-f]{2})(sk-[A-Za-z0-9]{32,}[A-Za-z0-9_-]*)(?:\z|[^A-Za-z0-9_\\-]|\\(?:[ntrbf"\\]|u[0-9A-Fa-f]{4})|%[0-9A-Fa-f]{2})
  | (ghs_[A-Za-z0-9_-]{36,})(?:\z|[^A-Za-z0-9_.\\-]|\.(?:\z|[^A-Za-z0-9_\\-])|\\(?:[ntrbf"\\]|u[0-9A-Fa-f]{4})|%[0-9A-Fa-f]{2})
)'''
capture_groups = [1, 2, 3]

[recognizers.scoring]
base = 0.95
priority = 100

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"

# Fail closed on incomplete private-key armour after 16 base64 source units.
# Optional END may differ from BEGIN. Framing stays in the restorable span;
# public armour and documentation placeholders do not qualify.
[[recognizers]]
id = "security_token.pem"
safety_tier = "safe_default"
class = "custom:security_token"
enabled = true
locales = ["global"]
locale_basis = "format"
cooperates_with = ["security_token.anchored", "security_token.code", "security_token.bare"]

[recognizers.match]
kind = "regex"
pattern = '''(?x)(-----BEGIN\x20(?:(?:(?:RSA|EC|DSA|OPENSSH|ENCRYPTED)\x20)?PRIVATE\x20KEY|PGP\x20PRIVATE\x20KEY\x20BLOCK)-----(?:\r?\n|\\(?:r\\)?n|\\\\(?:r\\\\)?n|\\u000[aAdD]|(?i:<br\x20*/?>)|\\\r?\n)(?:["'][\x20\t]*\+?[\x20\t]*(?:\r?\n[\x20\t]*)?["'])?(?:[\x20\t]*(?:\#|>|\*)[\x20\t]*)*(?:(?:Proc-Type:[\x20\t]*4,ENCRYPTED|DEK-Info:[\x20\t]*[A-Za-z0-9-]+,[0-9A-Fa-f]+|(?:Version|Comment|Charset):[^\r\n\\<>"\']*)(?:\r?\n|\\(?:r\\)?n|\\\\(?:r\\\\)?n|\\u000[aAdD]|(?i:<br\x20*/?>)|\\\r?\n)(?:["'][\x20\t]*\+?[\x20\t]*(?:\r?\n[\x20\t]*)?["'])?(?:[\x20\t]*(?:\#|>|\*)[\x20\t]*)*)*(?:[\x20\t]|(?:\r?\n|\\(?:r\\)?n|\\\\(?:r\\\\)?n|\\u000[aAdD]|(?i:<br\x20*/?>)|\\\r?\n)(?:["'][\x20\t]*\+?[\x20\t]*(?:\r?\n[\x20\t]*)?["'])?(?:[\x20\t]*(?:\#|>|\*)[\x20\t]*)*)*(?:(?:[A-Za-z0-9+/=]|\\/)(?:[\x20\t]|(?:\r?\n|\\(?:r\\)?n|\\\\(?:r\\\\)?n|\\u000[aAdD]|(?i:<br\x20*/?>)|\\\r?\n)(?:["'][\x20\t]*\+?[\x20\t]*(?:\r?\n[\x20\t]*)?["'])?(?:[\x20\t]*(?:\#|>|\*)[\x20\t]*)*)*){15}(?:[A-Za-z0-9+/=]|\\/)(?:(?:[A-Za-z0-9+/=]|\\/)|(?:[\x20\t]|(?:\r?\n|\\(?:r\\)?n|\\\\(?:r\\\\)?n|\\u000[aAdD]|(?i:<br\x20*/?>)|\\\r?\n)(?:["'][\x20\t]*\+?[\x20\t]*(?:\r?\n[\x20\t]*)?["'])?(?:[\x20\t]*(?:\#|>|\*)[\x20\t]*)*))*(?:-----END\x20(?:(?:(?:RSA|EC|DSA|OPENSSH|ENCRYPTED)\x20)?PRIVATE\x20KEY|PGP\x20PRIVATE\x20KEY\x20BLOCK)-----)?)'''
capture_groups = [1]

[recognizers.scoring]
base = 0.95
priority = 100

[recognizers.token]

[recognizers.source]
origin = "project-authored"
license = "Apache-2.0"
