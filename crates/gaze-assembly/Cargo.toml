[package]
name = "gaze-assembly"
version = "0.17.0"
edition = "2021"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Policy-to-pipeline assembly for Gaze"
readme = "README.md"
keywords = ["pii", "gaze", "pipeline"]
categories = ["text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
perf-timers = ["gaze-types/perf-timers", "gaze/perf-timers", "gaze-recognizers/perf-timers"]
safety-net-nym = ["gaze-recognizers/safety-net-nym"]

[dependencies]
gaze-types = { path = "../gaze-types", version = "0.17.0" }
gaze = { path = "../gaze", version = "0.17.0", package = "gaze-pii" }
gaze-recognizers = { path = "../gaze-recognizers", version = "0.17.0" }
regex = "1"
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[[example]]
name = "registry_contract"
test = false
