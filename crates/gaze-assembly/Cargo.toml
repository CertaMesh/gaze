[package]
name = "gaze-assembly"
version = "0.6.4"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Policy-to-pipeline assembly for Gaze"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gaze = { path = "../gaze", version = "0.6.4", package = "gaze-pii" }
gaze-recognizers = { path = "../gaze-recognizers", version = "0.6.4" }
regex = "1"
serde_json = "1"
thiserror = "1"
tracing = "0.1"
