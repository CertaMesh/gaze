[advisories]
ignore = [
    # RUSTSEC-2023-0089 (atomic-polyfill): informational "unmaintained", no patched version. Reached via phonenumber -> postcard -> heapless 0.7, which enables it only on avr, riscv32, thumbv6m and xtensa targets, so it is never compiled for Gaze targets; cargo-deny reports it because deny.toml checks all targets. Re-checked 2026-11-26: postcard 1.2.0 still selects heapless 0.7 through its default heapless-cas feature. Revisit when phonenumber's postcard moves to heapless 0.8+, or by 2027-02-26.
    "RUSTSEC-2023-0089",
    # RUSTSEC-2024-0436 (paste): informational "unmaintained", no patched version. Proc-macro dependency of tokenizers and macro_rules_attribute. Re-checked 2026-11-26: Gaze pins tokenizers 0.22, and tokenizers 0.23.2 still requires paste directly. Revisit when tokenizers drops paste, or by 2027-02-26.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0194/RUSTSEC-2026-0195 (quick-xml): patched in quick-xml >=0.41, but phonenumber 0.3.9 caps quick-xml at <=0.38. Gaze uses only phonenumber's bundled metadata and never its XML loader, so no user XML reaches quick-xml. Re-checked 2026-11-26: phonenumber 0.3.10 allows quick-xml 0.41 but also updates libphonenumber metadata (9.0.21 -> 9.0.33), which changes phone detection and needs the benchmark gain gate. Revisit when that bump lands, or by 2027-02-26.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RUSTSEC-2026-0192 (ttf-parser): informational "unmaintained", no patched version. Dev-only path for document test fixtures via imageproc -> ab_glyph -> owned_ttf_parser; not in release binaries. Re-checked 2026-11-26: ab_glyph 0.2.32 and owned_ttf_parser 0.25.1 are the latest releases. Revisit when ab_glyph moves to a maintained font parser, or by 2027-02-26.
    "RUSTSEC-2026-0192",
    # RUSTSEC-2026-0543 (chrono): informational "unmaintained", no vulnerability and no patched version. Beyond gaze-cli and gaze-proxy, chrono is a normal dependency of rmcp, schemars and pdfium-render, so replacing our own uses would not remove it. Revisit when those crates move to jiff or time, or by 2027-02-26.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # webpki-roots ships Mozilla's root store under the permissive Community Data License.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# MPL-2.0 is allowed only for `option-ext`, a tiny transitive helper pulled in by
# dirs-sys -> dirs -> gaze-proxy for platform data/config path resolution. Keep
# this bounded to the exact crate and revisit after replacing `dirs`, after
# dirs-sys drops option-ext, or by 2026-12-10.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

private = { ignore = true }

[bans]
workspace-default-features = "allow"

# Safety-net dependency bans are graph-scoped in
# `cargo run -p xtask -- cargo-metadata-audit-isolation`.
# cargo-deny's package bans are intentionally not used for the Phase 0
# `reqwest`/`hyper`/`tokio`/`ureq` safety-net rules because global bans would
# also hit the existing v0.5 NER graph. xtask is the authoritative gate;
# cargo-deny remains secondary belt-and-suspenders for feature policy.
