[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # webpki-roots ships Mozilla's root store under the permissive Community Data License.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

private = { ignore = true }

[bans]
workspace-default-features = "allow"

[[bans.features]]
crate = "gaze"
deny = ["audit"]
reason = "The temporary v0.5 compatibility shim must not be enabled in normal CI builds; default and --no-default-features must keep gaze-audit out of gaze core."
