[pass2_ner]
id = "davlan-mbert-ner-hrl-onnx"
hf_repo = "onnx-community/bert-base-multilingual-cased-ner-hrl-ONNX"
hf_commit = "cfe67b1c1c4c91c1b26ac192955fc0971e62d8c8"
bundle_sha = "7b0b9d0d200bf7f3a39654257f8723998316600852edff8404834eb7edfc5c16"   # SHA256 of the canonical SHA256SUMS manifest for these seven ONNX runtime artifacts
runtime = "onnxruntime"
model_file = "model.onnx"
fetch_script = "scripts/fetch/fetch-ner-model.sh"
required_artifacts = ["model.onnx", "tokenizer.json", "config.json", "tokenizer_config.json", "special_tokens_map.json", "vocab.txt", "labels.json"]

[builtin_source_ids]
ids = [
    "ner",
    "openai-privacy-filter",
    "openai-privacy-filter-subprocess",
]

# Rulepack source IDs registered ahead of the detection change that ships them, so the
# base and that change measure under one benchmark specification. The scorer adds the `id`
# of every top-level table here to its source-ID vocabulary; accepting an ID the base never
# emits changes no score, and once the rule lands in bundled `core` its rulepack declares
# the same ID, so the vocabulary is unchanged. These tables are not models.
[pinned_rule_customer_id_field]
id = "customer_id.field"

[pinned_rule_employee_id_field]
id = "employee_id.field"

[pinned_rule_record_id_field]
id = "record_id.field"

[pinned_rule_customer_id_prose]
id = "customer_id.prose"

[pinned_rule_employee_id_prose]
id = "employee_id.prose"

[pinned_rule_record_id_prose]
id = "record_id.prose"
