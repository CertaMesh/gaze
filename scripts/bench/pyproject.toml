[project]
name = "gaze-bench"
version = "0.1.0"
description = "Locked Python environment for Gaze benchmark adapters and scoring tests"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyarrow==23.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
comparison-test = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
]

[tool.uv]
package = false
