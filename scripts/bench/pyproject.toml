[project]
name = "gaze-bench"
version = "0.1.0"
description = "Locked Python environment for Gaze benchmark adapters and scoring tests"
requires-python = ">=3.11,<3.14"
dependencies = [
    "packaging==26.2",
    "pyarrow==23.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
comparison-test = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
]

[tool.uv]
package = false
# Presidio's pinned span resolver is required by the comparison contract, but
# its cryptography <49 bound excludes the security fixes in 50.0.0 and later.
# The model-free comparison tests exercise the resolver with this override.
override-dependencies = ["cryptography>=50.0.2,<51"]
