name: temporary dashboard stress
on:
  push:
    branches: [fix-dashboard-lifecycle-race]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
      - name: Runner metadata
        run: |
          mkdir -p proof
          uname -a > proof/hardware.txt
          lscpu >> proof/hardware.txt
          cp crates/gaze-proxy-dashboard/src/runtime.rs /tmp/candidate-runtime.rs
      - name: Mutation probe removes purge acknowledgement wait
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/gaze-proxy-dashboard/src/runtime.rs')
          text = p.read_text()
          old = 'DashboardLifecycle::Purging { .. } => true,'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'DashboardLifecycle::Purging { .. } => false,'))
          PY
          set +e
          nice -n 19 cargo test -p gaze-proxy-dashboard --all-features --lib runtime::tests::epoch_ack_waits_for_running_and_rejects_terminal_states -- --exact --nocapture > proof/mutation.log 2>&1
          mutation_exit=$?
          set -e
          cp /tmp/candidate-runtime.rs crates/gaze-proxy-dashboard/src/runtime.rs
          test "$mutation_exit" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          text = Path('proof/mutation.log').read_text()
          assert 'test runtime::tests::epoch_ack_waits_for_running_and_rejects_terminal_states ... FAILED' in text
          print('acknowledgement-removal mutation detected by the expected test')
          PY
          echo "mutation caught, exit=$mutation_exit" | tee proof/mutation-result.txt
          nice -n 19 cargo test -p gaze-proxy-dashboard --all-features --lib runtime::tests::epoch_ack_waits_for_running_and_rejects_terminal_states -- --exact >> proof/mutation-restored.log 2>&1
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Workspace clippy gate
        run: nice -n 19 cargo clippy --workspace --all-features --all-targets -- -D warnings 2>&1 | tee proof/clippy.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dashboard-proof
          path: proof
