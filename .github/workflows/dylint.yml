# dylint runs on a weekly schedule (Mondays 08:00 UTC) and manual dispatch.
# PR trigger blocked on solo todo #1870.
# Per-push triggers were dropped 2026-04-29 to reduce CI minute pressure.
# Devs do not need nightly-2025-09-18 installed locally; trigger manually with:
#   gh workflow run dylint.yml
name: dylint

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:

jobs:
  dylint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install nightly toolchain for dylint
        run: rustup toolchain install nightly-2025-09-18 --component rustc-dev,rust-src,llvm-tools-preview
      - name: Install cargo-dylint
        run: cargo install --locked cargo-dylint dylint-link
      - name: Cache cargo registry and git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dylint-cargo-${{ runner.os }}-${{ hashFiles('lint/dylint/Cargo.lock') }}
      - name: Cache dylint target
        uses: actions/cache@v5
        with:
          path: lint/dylint/target
          key: dylint-target-${{ runner.os }}-${{ hashFiles('lint/dylint/Cargo.lock') }}
      - name: UI fixtures
        working-directory: lint/dylint
        run: cargo test --test ui
      - name: Run dylint gate
        run: cargo run -p xtask -- dylint-gate
