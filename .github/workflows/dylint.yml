# Called by the fast PR lane when relevant, and by every integration candidate.
# Keep the weekly run to detect toolchain or infrastructure drift.
name: dylint

on:
  workflow_call:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dylint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Install nightly toolchain for dylint
        run: rustup toolchain install nightly-2025-09-18 --component rustc-dev,rust-src,llvm-tools-preview
      - name: Cache cargo registry and git
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dylint-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'lint/dylint/Cargo.lock') }}
          restore-keys: |
            dylint-cargo-${{ runner.os }}-
      - name: Cache Dylint tools
        id: dylint-tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
          key: dylint-tools-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-dylint-6.0.4
      - name: Install cargo-dylint
        if: steps.dylint-tools.outputs.cache-hit != 'true'
        run: cargo install --locked --version 6.0.4 cargo-dylint dylint-link
      - name: Cache lint, driver, and workspace targets
        id: dylint-target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            lint/dylint/target
            target
            ~/.dylint_drivers
          key: dylint-target-${{ runner.os }}-${{ runner.arch }}-6.0.4-${{ hashFiles('Cargo.lock', 'lint/dylint/Cargo.toml', 'lint/dylint/Cargo.lock', 'lint/dylint/src/**', 'rust-toolchain.toml', 'lint/dylint/rust-toolchain.toml') }}-clippy-main
      # A cold Dylint driver build clones rust-clippy and checks out `master`
      # (hardcoded in dylint_internal 5.0.0 through 6.2.0). rust-clippy now
      # only has `main`, so serve the clone from a local mirror whose `master`
      # tracks upstream `main`. Drop this once dylint clones `main`.
      - name: Serve rust-clippy master from main
        if: steps.dylint-target.outputs.cache-hit != 'true'
        run: |
          mirror="$RUNNER_TEMP/rust-clippy.git"
          git clone --bare --quiet https://github.com/rust-lang/rust-clippy "$mirror"
          git -C "$mirror" update-ref refs/heads/master refs/heads/main
          git -C "$mirror" symbolic-ref HEAD refs/heads/master
          git config --global url."$mirror".insteadOf https://github.com/rust-lang/rust-clippy
      - name: UI fixtures
        working-directory: lint/dylint
        run: cargo test --locked --test ui
      - name: Run dylint gate
        env:
          GAZE_DYLINT_REQUIRED: "1"
        run: cargo run -p xtask --locked -- dylint-gate
