name: dashboard pairing

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/gaze-proxy-dashboard/**'
      - '.github/workflows/dashboard-pairing.yml'

permissions:
  contents: read

jobs:
  linux-dashboard:
    name: native Linux dashboard lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Record exact source and platform
        run: |
          git rev-parse HEAD HEAD^{tree}
          uname -a
          rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check dashboard lint
        run: cargo clippy --locked -p gaze-proxy-dashboard --all-targets -- -D warnings
      - name: Test dashboard protocol, lifecycle, isolation and no-dump contracts
        run: cargo test --locked -p gaze-proxy-dashboard
      - name: Test registration-bound inspection lifecycle
        run: cargo test --locked -p gaze-inspection
