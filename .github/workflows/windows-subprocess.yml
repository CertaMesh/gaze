name: Windows subprocess ownership
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-subprocess:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
      - name: Verify native runtime and Python pipe support
        run: |
          rustc --version
          python -c "import sys; assert sys.version_info >= (3, 12); print(sys.version)"
      - name: Run synthetic Windows subprocess contracts
        run: cargo test -p gaze-recognizers --no-default-features --features safety-net-openai,safety-net-kiji,test-support --locked -j4 --test windows_subprocess -- --test-threads=1 --nocapture
      - name: Run cancellation interleaving contracts
        if: ${{ !cancelled() }}
        run: cargo test -p gaze-recognizers --no-default-features --features safety-net-openai,safety-net-kiji,test-support --locked -j4 --lib subprocess_io::tests
      - name: Lint Windows adapter
        if: ${{ !cancelled() }}
        run: cargo clippy -p gaze-recognizers --no-default-features --features safety-net-openai,safety-net-kiji,test-support --locked -j4 --lib --test windows_subprocess -- -D warnings
