name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stdlib-only, no external corpus and no model: fails if the benchmark document
      # drifts from the release scorecards it reports.
      - name: benchmark document matches its committed evidence
        run: python3 scripts/bench/render_benchmark_doc.py --check

      - name: adjacency layer table matches its committed measurements
        run: python3 scripts/bench/render_agentic_adjacency_doc.py --check

      - name: mechanism arm table matches its committed observation records
        run: python3 scripts/bench/mechanism_arms.py check

      - name: leak ledger matches its committed observation record
        run: python3 scripts/bench/leak_ledger.py check

      - name: benchmark renderer contract tests
        run: python3 -m unittest discover -s scripts/bench -p 'test_render_*doc.py'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --exclude gaze-cli

      - name: cargo test --doc
        run: cargo test --doc --workspace --all-features
