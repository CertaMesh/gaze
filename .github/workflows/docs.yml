name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release_char_level.py check resolves release tags and their commits' crates trees.
          fetch-depth: 0

      - name: Select full evidence scan for changed publication inputs
        id: evidence
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts/ci')
          from ci_gate import changed_paths

          inputs = {
              'scripts/bench/evidence_home_paths.py',
              'scripts/bench/export_portable_record.py',
              'docs/reference/benchmarks/portable-evidence-receipts.json',
          }
          paths = changed_paths(os.environ['BASE_SHA'], os.environ['HEAD_SHA'])
          changed = any(path.endswith('.gz') or path in inputs for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\n')
          PY

      # Stdlib-only, no external corpus and no model: fails if the benchmark document
      # drifts from the release scorecards it reports.
      - name: benchmark document matches its committed evidence
        run: python3 scripts/bench/render_benchmark_doc.py --check

      - name: credential-inclusive contract stays in sync
        run: python3 scripts/bench/compare/derive_contract_v4.py --check

      - name: competitor comparison matches current benchmark inputs
        run: python3 scripts/bench/compare/render.py docs/reference/benchmarks/comparison.json --page docs/reference/benchmarks/competitors.md --check

      - name: competitors' own benchmarks block matches its committed aggregate
        run: python3 scripts/bench/compare/theirbench/render_theirbench.py render --check

      - name: adjacency layer table matches its committed measurements
        run: python3 scripts/bench/render_agentic_adjacency_doc.py --check

      - name: dictionary API sequence history matches canonical replay
        run: python3 scripts/bench/dictionary_sequence_history.py check

      - name: Check effective family precedence history
        run: python3 scripts/bench/family_precedence_history.py check
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.31
          enable-cache: true
          cache-dependency-glob: scripts/bench/uv.lock

      # Spec-bound arm records replay only under the pinned measuring runtime
      # (CPython 3.13, its Unicode tables and the locked pyarrow).
      - name: mechanism arm table matches its committed observation records
        run: uv run --project scripts/bench --python 3.13 --locked --no-dev python scripts/bench/mechanism_arms.py check

      - name: leak ledger matches its committed observation record
        run: python3 scripts/bench/leak_ledger.py check

      - name: tracked gzip evidence carries no absolute home path
        if: ${{ github.event_name == 'push' || steps.evidence.outputs.changed == 'true' }}
        run: python3 scripts/bench/evidence_home_paths.py check

      - name: scrubbed evidence archives equal their originals except path fields
        run: python3 scripts/bench/evidence_home_paths.py verify-receipts

      - name: release character-level scores match the release history
        run: python3 scripts/bench/compare/release_char_level.py check

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1 (existing commit pin)

      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --exclude gaze-cli
