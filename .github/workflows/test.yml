name: test
run-name: "CI (${{ github.sha }})"

on:
  push:
    branches: [main]
  pull_request:

  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      sample_paths:
        description: 'Optional synthetic PR samples as JSON objects, e.g. [{"name":"docs","paths":["README.md"]}]'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  # Full PR integration until the queue and required checks are activated.
  # Python compares this value exactly; only 'enabled' selects the fast PR lane.
  GAZE_CI_FAST_LANE: ${{ vars.GAZE_CI_FAST_LANE }}

jobs:
  plan:
    name: Select PR checks or full integration
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.plan.outputs.integration }}
      wide: ${{ steps.plan.outputs.wide }}
      packages: ${{ steps.plan.outputs.packages }}
      msrv: ${{ steps.plan.outputs.msrv }}
      bench: ${{ steps.plan.outputs.bench }}
      dylint: ${{ steps.plan.outputs.dylint }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Select affected packages and mandatory owners
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/ci_gate.py plan --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  fast:
    name: PR fmt, affected clippy and tests (not integration)
    needs: [plan]
    if: ${{ needs.plan.outputs.integration == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Set up OCR and sample disk space
        if: ${{ needs.plan.outputs.packages != '[]' }}
        uses: ./.github/actions/setup-ocr
      - name: Run conservative PR checks
        env:
          PACKAGES_JSON: ${{ needs.plan.outputs.packages }}
        run: python3 scripts/ci/ci_gate.py fast

  fast-sample:
    name: Synthetic PR path sample (${{ matrix.name }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_paths != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.sample_paths || '[{"name":"disabled","paths":[]}]') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Select synthetic paths with the real PR selector
        id: sample
        env:
          SAMPLE_PATHS: ${{ toJSON(matrix.paths) }}
          # Synthetic samples cannot change the actual full dispatch plan.
          GAZE_CI_FAST_LANE: enabled
        run: python3 scripts/ci/ci_gate.py plan --event pull_request --paths-json "$SAMPLE_PATHS"
      - name: Set up OCR and sample disk space
        if: ${{ steps.sample.outputs.packages != '[]' }}
        uses: ./.github/actions/setup-ocr
      - name: Run the real PR lane on the synthetic path sample
        env:
          PACKAGES_JSON: ${{ steps.sample.outputs.packages }}
        run: python3 scripts/ci/ci_gate.py fast

  dylint:
    needs: [plan]
    if: ${{ needs.plan.outputs.dylint == 'true' }}
    uses: ./.github/workflows/dylint.yml

  msrv:
    needs: [plan]
    if: ${{ needs.plan.outputs.msrv == 'true' }}
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.89.0
        with:
          toolchain: 1.89.0
      - name: Set up OCR and sample disk space
        uses: ./.github/actions/setup-ocr
        with:
          install-ocr: 'false'
      - name: Cache cargo registry + target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-dependencies-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-dependencies-v2-
      - name: Require a fresh ORT distribution after cache restore
        shell: bash
        run: |
          test ! -e "$HOME/.cache/ort.pyke.io/dfbin"
          echo 'ORT distribution absent after cache restore; ort-sys must download and verify its pinned archive.'
      - name: cargo check workspace (MSRV)
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
        # All-features MSRV is intentionally not gated.
        run: cargo check --workspace --all-targets --locked
      - name: Report disk space after build and sampled peak use
        if: ${{ always() }}
        shell: bash
        run: |
          native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          if [[ -f "$native/lib/libonnxruntime.a" || -f "$native/libonnxruntime.a" ]]; then
            echo 'ORT pinned distribution installed in this job; ort-sys checks the downloaded archive SHA-256 before installing this directory.'
          else
            echo 'ORT pinned distribution was not installed in this job.'
          fi
          df -h "$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/gaze-disk-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gaze-disk-sampler.pid")"
            df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/gaze-disk-free-kib.txt"
            awk 'NR == 1 || $1 < min { min = $1 } END { printf "Minimum sampled free disk: %.2f GiB (%d KiB), %d samples, 5s interval\n", min / 1048576, min, NR }' "$RUNNER_TEMP/gaze-disk-free-kib.txt"
          fi

  test-support:
    needs: [plan]
    if: ${{ needs.plan.outputs.integration == 'true' }}
    name: test support and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NYM_SMALL_INT8_BUNDLE_SHA256: 71f9023bcf86ead7234434f11a4881c0b0a87622ba4e2e44b74f55d3ede7c767
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Set up OCR and sample disk space
        uses: ./.github/actions/setup-ocr
      # Keep the name and dependency-only key parsed by the producer-binding regression test.
      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-dependencies-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-dependencies-v2-
      - name: Require a fresh ORT distribution after cache restore
        shell: bash
        run: |
          test ! -e "$HOME/.cache/ort.pyke.io/dfbin"
          echo 'ORT distribution absent after cache restore; ort-sys must download and verify its pinned archive.'
      - name: Test shard ownership and evidence contracts
        run: python3 -m unittest discover -s scripts/ci
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Reject raw UTF-8 suffix revalidation in the JSON parser
        run: python3 scripts/gate/json-tree-utf8-mutation-probe.py
      # Linux-only: the canonical harness uses a POSIX producer transport.
      # Call its build function so flags/features cannot diverge from bench runs.
      - name: Cache detached validator probe target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/validator-recall-probe
          key: ${{ runner.os }}-validator-probe-1.96-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-validator-probe-1.96-
      - name: Build canonical validator probe --locked
        run: python3 scripts/ci/validator_probe_gate.py
      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: cargo test gaze-document mcp feature
        run: cargo test -p gaze-document --features mcp --no-fail-fast
      - name: cargo test gaze-cli mcp feature
        run: cargo test -p gaze-cli --features mcp --no-fail-fast
      - name: Workspace all-feature doctests
        run: cargo test --workspace --all-features --doc --no-fail-fast
      - name: Cache pinned Nym bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/gaze/models/nym-small-int8
          key: ${{ runner.os }}-nym-small-int8-${{ env.NYM_SMALL_INT8_BUNDLE_SHA256 }}
      - name: Install and verify pinned Nym bundle
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}
        run: |
          set -euo pipefail
          grep -Fq "$NYM_SMALL_INT8_BUNDLE_SHA256" crates/gaze-recognizers/src/safety_net/nym/artifacts.rs
          bundle="$XDG_DATA_HOME/gaze/models/nym-small-int8"
          mkdir -p "$bundle"
          chmod 700 "$bundle"
          revision=4348999cd3c2e20c49615e9af7c6bbb45b64cd85
          base="https://huggingface.co/Wismut/nym-pii-multilingual-small/resolve/$revision/int8"
          for file in config.json model_int8.onnx tokenizer.json; do
            if [[ ! -f "$bundle/$file" ]]; then
              curl --fail --location --retry 3 --output "$bundle/$file" "$base/$file"
            fi
          done
          printf '%s\n' \
            '3f07065571e22bb73eba28ddb1fae4509c0cf703762e3bfa7a6ab2111cf7cb88  config.json' \
            '139006aea2cbd8e709d322f056232570de54661f624143be4893aaa387190286  model_int8.onnx' \
            'c299144e68dfec1dc536204a7ae3712710c5c6cade9269a83f5042250d47d8de  tokenizer.json' > "$bundle/SHA256SUMS"
          printf '%s  %s\n' "$NYM_SMALL_INT8_BUNDLE_SHA256" "$bundle/SHA256SUMS" | sha256sum -c -
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          chmod 600 "$bundle"/*
      - name: Test live Nym leak detection and restore
        shell: bash
        env:
          GAZE_NYM_MODEL_DIR: ${{ runner.temp }}/gaze/models/nym-small-int8
        run: |
          set -euo pipefail
          for name in live_plate_in_prose_is_a_suspect live_salutation_protects_surname_but_not_unsupported_secret live_long_document_is_scanned_to_the_end live_capture_matches_the_committed_fixture; do
            cargo test -p gaze-recognizers --features safety-net-nym,test-support --test nym_safety_net "$name" -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/$name.log"
            grep -Fq "test $name ... ok" "$RUNNER_TEMP/$name.log"
          done
          for name in live_nym_net_tokenizes_a_plate_the_rules_miss policy_nym_model_dir_activates_live_bundle live_nym_suspects_ignore_random_session_hex live_person_name_is_one_restorable_token_with_thresholds_in_audit live_nym_fallback_never_replaces_an_owned_placeholder; do
            cargo test -p gaze-cli --all-features --test nym_cli "$name" -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/$name.log"
            grep -Fq "test $name ... ok" "$RUNNER_TEMP/$name.log"
          done
          name=eval_and_clean_protect_the_same_nym_policy_bytes
          cargo test -p gaze-cli --all-features --test eval_cli "$name" -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/$name.log"
          grep -Fq "test $name ... ok" "$RUNNER_TEMP/$name.log"
      - name: Cache pinned Davlan NER bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/gaze/models/davlan-mbert-ner-hrl
          key: ${{ runner.os }}-davlan-ner-7b0b9d0d200bf7f3a39654257f8723998316600852edff8404834eb7edfc5c16
      - name: Install and verify pinned Davlan NER bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '7b0b9d0d200bf7f3a39654257f8723998316600852edff8404834eb7edfc5c16' crates/gaze-recognizers/src/ner/pinned.rs
          cargo run --locked -p gaze-cli -- setup --safety-net none --non-interactive \
            --model-dir "$RUNNER_TEMP/gaze/models/davlan-mbert-ner-hrl" \
            --policy-out "$RUNNER_TEMP/ner-only.toml" --force
          printf '%s  %s\n' \
            '7b0b9d0d200bf7f3a39654257f8723998316600852edff8404834eb7edfc5c16' \
            "$RUNNER_TEMP/gaze/models/davlan-mbert-ner-hrl/SHA256SUMS" | sha256sum -c -
          (cd "$RUNNER_TEMP/gaze/models/davlan-mbert-ner-hrl" && sha256sum -c SHA256SUMS)
      - name: Test setup policy with both pinned models
        shell: bash
        env:
          GAZE_SETUP_TEST_MODEL_DIR: ${{ runner.temp }}/gaze/models/davlan-mbert-ner-hrl
          GAZE_SETUP_TEST_DATA_HOME: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cargo test -p gaze-cli --all-features --test setup_policy -- --nocapture > "$RUNNER_TEMP/setup_policy.log" 2>&1
          cat "$RUNNER_TEMP/setup_policy.log"
          grep -Fq 'test setup_default_attaches_nym_and_catches_the_plate ... ok' "$RUNNER_TEMP/setup_policy.log"
          grep -Fq 'test setup_cli_clean_tokenizes_every_bundled_class ... ok' "$RUNNER_TEMP/setup_policy.log"
          cargo test -p gaze-cli --all-features --bin gaze commands::setup::tests::non_interactive_existing_model_skips_download_writes_policy_and_doctor_passes -- --exact --nocapture > "$RUNNER_TEMP/setup_doctor.log" 2>&1
          cat "$RUNNER_TEMP/setup_doctor.log"
          grep -Fq 'test commands::setup::tests::non_interactive_existing_model_skips_download_writes_policy_and_doctor_passes ... ok' "$RUNNER_TEMP/setup_doctor.log"
      - name: Compile rust-library how-to Nym Rust example
        run: cargo build --locked -p gaze-assembly --features safety-net-nym --example setup_nym
      - name: Verify synthetic bridge Python requirement
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python >= 3.11 required"'
      - name: Build offline synthetic rmcp bridge
        run: cargo build --locked --offline -p gaze-mcp-rmcp --example evidence_bridge
      - name: Test real synthetic rmcp bridge
        run: python3 scripts/bench/test_evidence_bridge.py --integration --binary target/debug/examples/evidence_bridge
      - name: Prepare Python for private build binding
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.16
      - name: Install binding test interpreter before offline execution
        run: uv python install 3.13
      - name: Test private fresh-build producer binding
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          binding_cargo="$(rustup which cargo)"
          binding_toolchain="$(dirname "$(dirname "$binding_cargo")")"
          binding_revision="$(git rev-parse HEAD)"
          # ort-sys 2.0.0-rc.12 dist.txt: CPU-only Linux x86_64 distribution.
          # Prior workspace builds provide this archive. No search or fallback.
          binding_native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          test -f "$binding_native/libonnxruntime.a"
          test ! -L "$binding_native/libonnxruntime.a"
          UV_OFFLINE=1 uv run --no-project --python 3.13 python \
            scripts/bench/test_producer_build_binding.py --integration \
            --repo "$GITHUB_WORKSPACE" --source-revision "$binding_revision" \
            --registry "$HOME/.cargo/registry" --native "$binding_native" \
            --toolchain "$binding_toolchain" --scratch-parent "$RUNNER_TEMP"
      - name: Report disk space after build and sampled peak use
        if: ${{ always() }}
        shell: bash
        run: |
          native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          if [[ -f "$native/lib/libonnxruntime.a" || -f "$native/libonnxruntime.a" ]]; then
            echo 'ORT pinned distribution installed in this job; ort-sys checks the downloaded archive SHA-256 before installing this directory.'
          else
            echo 'ORT pinned distribution was not installed in this job.'
          fi
          df -h "$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/gaze-disk-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gaze-disk-sampler.pid")"
            df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/gaze-disk-free-kib.txt"
            awk 'NR == 1 || $1 < min { min = $1 } END { printf "Minimum sampled free disk: %.2f GiB (%d KiB), %d samples, 5s interval\n", min / 1048576, min, NR }' "$RUNNER_TEMP/gaze-disk-free-kib.txt"
          fi

  workspace-shards:
    needs: [plan]
    if: ${{ needs.plan.outputs.integration == 'true' }}
    name: workspace tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [cli, runtime, gates]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Set up OCR and sample disk space
        uses: ./.github/actions/setup-ocr
      - name: Cache cargo registry + target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-dependencies-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-dependencies-v2-
      - name: Require a fresh ORT distribution after cache restore
        shell: bash
        run: |
          test ! -e "$HOME/.cache/ort.pyke.io/dfbin"
          echo 'ORT distribution absent after cache restore; ort-sys must download and verify its pinned archive.'
      - name: Install pinned nextest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/nextest.tar.gz" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-unknown-linux-gnu.tar.gz
          echo "682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version
      - name: Verify binary ownership and Cargo test-name equivalence
        run: python3 scripts/ci/test_shards.py collect --output target/shard-evidence/${{ matrix.shard }}
      - name: Verify removed dashboard workflow test coverage
        if: ${{ matrix.shard == 'gates' }}
        run: |
          python3 scripts/ci/test_shards.py covered-package --evidence target/shard-evidence/gates --package gaze-proxy-dashboard
          python3 scripts/ci/test_shards.py covered-package --evidence target/shard-evidence/gates --package gaze-inspection
      - name: Run workspace shard with per-test timing
        shell: bash
        run: |
          set -euo pipefail
          selection="$(python3 scripts/ci/test_shards.py filter '${{ matrix.shard }}')"
          cargo nextest run --workspace --all-features --profile ci --no-fail-fast -E "$selection"
      - name: Save test evidence
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p target/shard-evidence/${{ matrix.shard }}
          if [ -f target/nextest/ci/junit.xml ]; then
            cp target/nextest/ci/junit.xml target/shard-evidence/${{ matrix.shard }}/junit.xml
          fi
      - name: Upload shard coverage and timing
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-tests-${{ matrix.shard }}
          path: target/shard-evidence/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
      - name: Report disk space after build and sampled peak use
        if: ${{ always() }}
        shell: bash
        run: |
          native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          if [[ -f "$native/lib/libonnxruntime.a" || -f "$native/libonnxruntime.a" ]]; then
            echo 'ORT pinned distribution installed in this job; ort-sys checks the downloaded archive SHA-256 before installing this directory.'
          else
            echo 'ORT pinned distribution was not installed in this job.'
          fi
          df -h "$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/gaze-disk-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gaze-disk-sampler.pid")"
            df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/gaze-disk-free-kib.txt"
            awk 'NR == 1 || $1 < min { min = $1 } END { printf "Minimum sampled free disk: %.2f GiB (%d KiB), %d samples, 5s interval\n", min / 1048576, min, NR }' "$RUNNER_TEMP/gaze-disk-free-kib.txt"
          fi

  test-coverage:
    name: workspace test coverage proof
    runs-on: ubuntu-latest
    needs: [plan, workspace-shards]
    if: ${{ always() && needs.plan.outputs.integration == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-tests-cli
          path: evidence/cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-tests-runtime
          path: evidence/runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-tests-gates
          path: evidence/gates
      - name: Require exact once-only execution and publish top 20
        run: python3 scripts/ci/test_shards.py prove --evidence evidence --output evidence/report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-test-coverage
          path: evidence/report/
          if-no-files-found: error
          retention-days: 14

  # Preserve the existing required context while ruleset changes are reviewed.
  test:
    runs-on: ubuntu-latest
    needs: [plan, fast, test-support, workspace-shards, test-coverage]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Require test owners for this lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci_gate.py check --context test

  benchmark-model-free:
    needs: [plan]
    if: ${{ needs.plan.outputs.bench == 'true' }}
    name: benchmark model-free Python tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # release tags must resolve (tagged_gaze.tag_commit); a shallow clone has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # GLiNER identity admits the bootstrap source installed by this uv release.
          version: 0.11.31
          enable-cache: true
          cache-dependency-glob: scripts/bench/uv.lock
      - name: Sync locked benchmark environment
        run: uv sync --project scripts/bench --python 3.13 --locked --group comparison-test
      - name: Initialize private Python startup caches
        # Fresh uv installs can contain stale encodings caches; capture admission refuses them.
        run: env -u PYTHONDONTWRITEBYTECODE uv run --project scripts/bench --python 3.13 --group comparison-test python -c pass
      - name: Run benchmark scorer and comparator tests
        run: uv run --project scripts/bench --python 3.13 --group comparison-test python -m pytest -q scripts/bench --durations=30
      - name: Build model-free equivalence binaries
        run: |
          cargo build --locked -p gaze-cli --bin gaze
          cargo build --locked -p gaze-recognizers --example clean_for_bench
      - name: Prove no detector rule claims a benchmark card twin
        env:
          GAZE_CLI_BINARY: target/debug/gaze
        run: uv run --project scripts/bench --python 3.13 --group comparison-test python -m pytest -q scripts/bench/test_invisible_separator_cells.py -k CardTwinDetector
      - name: Prove exact native capture reuse on the committed fixture
        env:
          GAZE_CAPTURE_FIXTURE_BINARY: target/debug/examples/clean_for_bench
        run: uv run --project scripts/bench --python 3.13 --group comparison-test python -m pytest -q scripts/bench/test_capture_reuse.py
      # `cargo test --workspace` builds examples but never runs their unit tests; the
      # leak ledger's pool-dump pins (normalizer copy vs the pipeline trace) live here.
      - name: Run bench producer example tests
        run: cargo test --locked -p gaze-recognizers --all-features --example clean_for_bench
      - name: Check policy and CLI equivalence on committed sample
        run: uv run --project scripts/bench --python 3.13 --group comparison-test python scripts/bench/check_policy_equivalence.py --self-check

  xtask-feature-gates:
    needs: [plan]
    if: ${{ needs.plan.outputs.integration == 'true' }}
    name: xtask feature gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # bundle-tokenization-drift --verify-ack diffs snapshots against
          # origin/main...HEAD; a shallow clone silently degrades it to a no-op.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Set up OCR and sample disk space
        uses: ./.github/actions/setup-ocr
      - name: Cache cargo registry + target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-dependencies-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-dependencies-v2-
      - name: Require a fresh ORT distribution after cache restore
        shell: bash
        run: |
          test ! -e "$HOME/.cache/ort.pyke.io/dfbin"
          echo 'ORT distribution absent after cache restore; ort-sys must download and verify its pinned archive.'
      - name: xtask ci-feature-matrix
        run: cargo run -p xtask -- ci-feature-matrix --partition ci-gates
      - name: Report disk space after build and sampled peak use
        if: ${{ always() }}
        shell: bash
        run: |
          native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          if [[ -f "$native/lib/libonnxruntime.a" || -f "$native/libonnxruntime.a" ]]; then
            echo 'ORT pinned distribution installed in this job; ort-sys checks the downloaded archive SHA-256 before installing this directory.'
          else
            echo 'ORT pinned distribution was not installed in this job.'
          fi
          df -h "$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/gaze-disk-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gaze-disk-sampler.pid")"
            df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/gaze-disk-free-kib.txt"
            awk 'NR == 1 || $1 < min { min = $1 } END { printf "Minimum sampled free disk: %.2f GiB (%d KiB), %d samples, 5s interval\n", min / 1048576, min, NR }' "$RUNNER_TEMP/gaze-disk-free-kib.txt"
          fi

  workspace-default:
    needs: [plan]
    if: ${{ needs.plan.outputs.integration == 'true' }}
    name: workspace default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # bundle-tokenization-drift --verify-ack diffs snapshots against
          # origin/main...HEAD; a shallow clone silently degrades it to a no-op.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Set up OCR and sample disk space
        uses: ./.github/actions/setup-ocr
      - name: Cache cargo registry + target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-dependencies-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-dependencies-v2-
      - name: Require a fresh ORT distribution after cache restore
        shell: bash
        run: |
          test ! -e "$HOME/.cache/ort.pyke.io/dfbin"
          echo 'ORT distribution absent after cache restore; ort-sys must download and verify its pinned archive.'
      - name: Default-feature workspace suite
        run: cargo run -p xtask -- ci-feature-matrix --partition ci-default
      - name: Report disk space after build and sampled peak use
        if: ${{ always() }}
        shell: bash
        run: |
          native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          if [[ -f "$native/lib/libonnxruntime.a" || -f "$native/libonnxruntime.a" ]]; then
            echo 'ORT pinned distribution installed in this job; ort-sys checks the downloaded archive SHA-256 before installing this directory.'
          else
            echo 'ORT pinned distribution was not installed in this job.'
          fi
          df -h "$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/gaze-disk-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gaze-disk-sampler.pid")"
            df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/gaze-disk-free-kib.txt"
            awk 'NR == 1 || $1 < min { min = $1 } END { printf "Minimum sampled free disk: %.2f GiB (%d KiB), %d samples, 5s interval\n", min / 1048576, min, NR }' "$RUNNER_TEMP/gaze-disk-free-kib.txt"
          fi

  # Preserve the existing required context while ruleset changes are reviewed.
  xtask-gates:
    name: xtask gates
    runs-on: ubuntu-latest
    needs: [plan, fast, test, xtask-feature-gates, workspace-default]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Require coverage owners for this lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci_gate.py check --context xtask

  integration:
    # The stable required name must report on PRs AND merge_group. The run name
    # and job summary explicitly distinguish PR feedback from full integration.
    name: ci/integration
    runs-on: ubuntu-latest
    needs: [plan, fast, msrv, test-support, workspace-shards, test-coverage, test, benchmark-model-free, xtask-feature-gates, workspace-default, xtask-gates, dylint]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Require every mandatory owner, including cancelled and missing results
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci_gate.py check --context integration
