name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (ubuntu-latest preinstalled bloat removal)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.89.0
        with:
          toolchain: 1.89.0
      - name: Install Tesseract + English language pack (gaze-document) + protoc (candle-onnx build dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng protobuf-compiler
      - name: Install pdfium dynamic library (gaze-document PDF input)
        run: |
          set -eu
          # Pinned release: https://github.com/bblanchon/pdfium-binaries/releases/tag/chromium%2F7920
          # Update by resolving the latest tag, downloading pdfium-linux-x64.tgz, and refreshing PDFIUM_SHA256.
          PDFIUM_RELEASE="chromium/7920"
          PDFIUM_SHA256="49ab3afbd4e6c1e284b5f2898129c8bb8a10fd785c1c5392c8c1fc70242f9ced"
          curl -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  /tmp/pdfium.tgz" | sha256sum -c -
          mkdir -p /tmp/pdfium-extract
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium-extract
          sudo install -m 0755 /tmp/pdfium-extract/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1.89-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1.89-
      - name: cargo check workspace (MSRV)
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
        # Opt-in runtime-tract needs rust >= 1.91 (tract 0.23.0-dev rust-version),
        # all-features MSRV is intentionally not gated.
        run: cargo check --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space (ubuntu-latest preinstalled bloat removal)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Install Tesseract + English language pack (gaze-document) + protoc (candle-onnx build dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng protobuf-compiler
      - name: Install pdfium dynamic library (gaze-document PDF input)
        run: |
          set -eu
          # Pinned release: https://github.com/bblanchon/pdfium-binaries/releases/tag/chromium%2F7920
          # Update by resolving the latest tag, downloading pdfium-linux-x64.tgz, and refreshing PDFIUM_SHA256.
          PDFIUM_RELEASE="chromium/7920"
          PDFIUM_SHA256="49ab3afbd4e6c1e284b5f2898129c8bb8a10fd785c1c5392c8c1fc70242f9ced"
          curl -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  /tmp/pdfium.tgz" | sha256sum -c -
          mkdir -p /tmp/pdfium-extract
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium-extract
          sudo install -m 0755 /tmp/pdfium-extract/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671
          key: ${{ runner.os }}-cargo-test-native-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-native-v2-
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: README version check
        run: cargo run -p xtask -- readme-version-check
      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: cargo test gaze-document mcp feature
        run: cargo test -p gaze-document --features mcp --no-fail-fast
      - name: cargo test gaze-cli mcp feature
        run: cargo test -p gaze-cli --features mcp --no-fail-fast
      - name: cargo test
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Verify synthetic bridge Python requirement
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python >= 3.11 required"'
      - name: Build offline synthetic rmcp bridge
        run: cargo build --locked --offline -p gaze-mcp-rmcp --example evidence_bridge
      - name: Test real synthetic rmcp bridge
        run: python3 scripts/bench/test_evidence_bridge.py --integration --binary target/debug/examples/evidence_bridge
      - name: Prepare Python for private build binding
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.16
      - name: Install binding test interpreter before offline execution
        run: uv python install 3.13
      - name: Test private fresh-build producer binding
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          binding_cargo="$(rustup which cargo)"
          binding_toolchain="$(dirname "$(dirname "$binding_cargo")")"
          binding_revision="$(git rev-parse HEAD)"
          # ort-sys 2.0.0-rc.12 dist.txt: CPU-only Linux x86_64 distribution.
          # Prior workspace builds provide this archive. No search or fallback.
          binding_native="$HOME/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/acc1cba79c337594ead1d88ca72516147aa60054c84217b53399a31caa5ba671"
          test -f "$binding_native/libonnxruntime.a"
          test ! -L "$binding_native/libonnxruntime.a"
          UV_OFFLINE=1 uv run --no-project --python 3.13 python \
            scripts/bench/test_producer_build_binding.py --integration \
            --repo "$GITHUB_WORKSPACE" --source-revision "$binding_revision" \
            --registry "$HOME/.cargo/registry" --native "$binding_native" \
            --toolchain "$binding_toolchain" --scratch-parent "$RUNNER_TEMP"

  benchmark-model-free:
    name: benchmark model-free Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.16
          enable-cache: true
          cache-dependency-glob: scripts/bench/uv.lock
      - name: Sync locked benchmark environment
        run: uv sync --project scripts/bench --locked
      - name: Run benchmark scorer and comparator tests
        run: uv run --project scripts/bench python -m unittest discover -s scripts/bench

  xtask-gates:
    name: xtask gates
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (ubuntu-latest preinstalled bloat removal)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # bundle-tokenization-drift --verify-ack diffs snapshots against
          # origin/main...HEAD; a shallow clone silently degrades it to a no-op.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Install Tesseract + English language pack (gaze-document) + protoc (candle-onnx build dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng protobuf-compiler
      - name: Install pdfium dynamic library (gaze-document PDF input)
        run: |
          set -eu
          # Pinned release: https://github.com/bblanchon/pdfium-binaries/releases/tag/chromium%2F7920
          # Update by resolving the latest tag, downloading pdfium-linux-x64.tgz, and refreshing PDFIUM_SHA256.
          PDFIUM_RELEASE="chromium/7920"
          PDFIUM_SHA256="49ab3afbd4e6c1e284b5f2898129c8bb8a10fd785c1c5392c8c1fc70242f9ced"
          curl -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  /tmp/pdfium.tgz" | sha256sum -c -
          mkdir -p /tmp/pdfium-extract
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium-extract
          sudo install -m 0755 /tmp/pdfium-extract/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-xtask-gates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xtask-gates-
      - name: xtask symmetric-potemkin
        run: cargo run -p xtask -- symmetric-potemkin
      - name: xtask class-map-override-safety
        run: cargo run -p xtask -- class-map-override-safety
      - name: xtask recognizer-composition-validator
        run: cargo run -p xtask -- recognizer-composition-validator
      - name: xtask no-tenant-knowledge
        run: cargo run -p xtask -- no-tenant-knowledge
      - name: xtask bundle-tokenization-drift
        # --verify-ack: any committed snapshot change (e.g. an emitted class
        # rename) must carry a `// drift-ack:` comment and a CHANGELOG line —
        # the v0.8 `custom:iban` -> `custom:family:payment-card-or-iban` change
        # merged silently without this and leaked downstream (issue #360).
        run: cargo run -p xtask -- bundle-tokenization-drift --verify-ack
      - name: xtask family-policy-table-coherence
        run: cargo run -p xtask -- family-policy-table-coherence
      - name: xtask locale-cue-bundle-coherence
        run: cargo run -p xtask -- locale-cue-bundle-coherence
      - name: xtask fixture-citation-lint
        run: cargo run -p xtask -- fixture-citation-lint
      - name: xtask trybuild-fixture-hygiene
        run: cargo run -p xtask -- trybuild-fixture-hygiene
      - name: xtask cargo-metadata-audit-isolation
        run: cargo run -p xtask -- cargo-metadata-audit-isolation
      - name: xtask readme-version-check
        run: cargo run -p xtask -- readme-version-check
      - name: xtask safety-net-sanity
        run: cargo run -p xtask -- safety-net-sanity
      - name: xtask dashboard-isolation
        run: cargo run -p xtask -- dashboard-isolation
      - name: xtask mcp-tier-isolation
        run: cargo run -p xtask -- mcp-tier-isolation
      - name: xtask ci-feature-matrix
        run: cargo run -p xtask -- ci-feature-matrix
