name: cargo-deny

# Two jobs with different failure modes:
# - `cargo-deny policy` checks licences, bans and sources and regenerates the
#   release licence file. Only a change in this repository can fail it, so it
#   runs on every PR and in the merge queue and is a required check on main.
# - `cargo-deny advisories` checks the RustSec database, which can turn red
#   overnight without any change here. It runs on a daily schedule and opens
#   (or comments on) an issue on failure instead of blocking merges.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: 0.19.7
  CARGO_ABOUT_VERSION: 0.8.2

jobs:
  policy:
    # Required check on main: keep this name stable.
    name: cargo-deny policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Cache cargo registry and tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}-about-${{ env.CARGO_ABOUT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}-about-${{ env.CARGO_ABOUT_VERSION }}-
      - name: Install pinned tools
        run: |
          # Check versions, not presence, so a pin change is never masked by a cached binary.
          cargo deny --version 2>/dev/null | grep -qx "cargo-deny $CARGO_DENY_VERSION" \
            || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          cargo about --version 2>/dev/null | grep -qx "cargo-about $CARGO_ABOUT_VERSION" \
            || cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --force
      # The release attaches this file to every binary; fail here, not at tag
      # time, when a dependency change leaves a licence cargo-about rejects or
      # an ort-sys bump outdates the vendored ONNX Runtime notices.
      - name: Generate third-party licences
        run: scripts/release/third-party-licenses.sh "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - name: cargo deny check bans licenses sources
        run: cargo deny check bans licenses sources

  advisories:
    name: cargo-deny advisories
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Cache cargo-deny
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-bin-${{ env.CARGO_DENY_VERSION }}
      - name: Install pinned cargo-deny
        run: |
          cargo deny --version 2>/dev/null | grep -qx "cargo-deny $CARGO_DENY_VERSION" \
            || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
      - name: cargo deny check advisories
        run: cargo deny check advisories
      - name: Open or update the advisory issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="cargo-deny advisories failing on main"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          body="The scheduled RustSec check failed: $RUN_URL. Bump the affected crate, or add a dated ignore with a written reason to deny.toml."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label dependencies --body "$body"
          fi
