name: cargo-deny

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
      - about.toml
      - 'scripts/release/third-party-licenses.*'
      - 'scripts/release/notices/**'
      - .github/workflows/cargo-deny.yml
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Cache cargo registry + cargo-deny install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
      - name: cargo deny check
        run: cargo deny check
      # The release attaches this file to every binary; fail here, not at tag
      # time, when a dependency change leaves a licence cargo-about rejects or
      # an ort-sys bump outdates the vendored ONNX Runtime notices.
      - name: Generate third-party licences
        run: |
          if ! command -v cargo-about >/dev/null 2>&1; then
            cargo install cargo-about --version 0.8.2 --locked
          fi
          scripts/release/third-party-licenses.sh "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
