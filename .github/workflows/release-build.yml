name: Build release binary

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      GAZE_RELEASE_FEATURES: document,proxy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.96.0
        with:
          targets: ${{ inputs.target }}
      # Never cache ~/.cache/ort.pyke.io: ort-sys must verify a fresh pinned download.
      - name: Require a fresh ORT distribution
        shell: bash
        run: test ! -e "$HOME/.cache/ort.pyke.io/dfbin"
      - name: Build
        run: cargo build --locked --release --bin gaze --target ${{ inputs.target }} --features "$GAZE_RELEASE_FEATURES"
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ inputs.target }}/release/gaze dist/${{ inputs.artifact }}
          chmod +x dist/${{ inputs.artifact }}
          (cd dist && shasum -a 256 ${{ inputs.artifact }} > ${{ inputs.artifact }}.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: smoke
      - name: Smoke artifact
        shell: bash
        run: |
          set -euo pipefail
          bin="smoke/${{ inputs.artifact }}"
          chmod +x "$bin"

          (cd smoke && shasum -a 256 -c "${{ inputs.artifact }}.sha256")
          "$bin" --version
          "$bin" clean --help | grep -q -- '--session-scope'
          "$bin" clean --help | grep -q -- '--ner-model-dir'
          "$bin" clean --help | grep -q -- '--ner-locale'
          "$bin" clean --help | grep -q -- '--rulepack-bundled'
          "$bin" clean --help | grep -q -- '--rulepack-path'
          "$bin" document --help | grep -q 'clean'
          "$bin" proxy --help | grep -q 'serve'
          "$bin" proxy --help | grep -q 'start'
          "$bin" proxy --help | grep -q 'stop'
          "$bin" proxy --help | grep -q 'status'
          "$bin" proxy --help | grep -q 'restart'

          clean_json="$(printf 'alice@example.invalid' | "$bin" clean)"
          clean_text="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["clean_text"])' <<< "$clean_json")"
          grep -q '<' <<< "$clean_text" || (echo "smoke failed: no token in output"; exit 1)
          restore_request="$(python3 -c 'import json,sys; v=json.load(sys.stdin); print(json.dumps({"session_blob": v["session_blob"], "text": v["clean_text"]}))' <<< "$clean_json")"
          restored_json="$(printf '%s' "$restore_request" | "$bin" restore)"
          python3 -c 'import json,sys; assert json.load(sys.stdin)["text"] == "alice@example.invalid"' <<< "$restored_json"

          policy="$(mktemp)"
          cat > "$policy" <<'POLICY'
          [session]
          scope = "persistent"
          ttl_secs = 86400

          [policy.rulepacks]
          bundled = ["core", "core-extended"]

          [[rule]]
          kind = "class"
          class = "custom:ip_address"
          action = "tokenize"

          [[rule]]
          kind = "default"
          action = "preserve"
          POLICY
          # Not a documentation range (192.0.2.0/24 etc.): those are deliberately left raw.
          extended_json="$(printf 'host 10.20.30.40' | "$bin" clean --policy="$policy")"
          extended_text="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["clean_text"])' <<< "$extended_json")"
          grep -q 'Custom:ip_address' <<< "$extended_text" || (echo "smoke failed: core-extended did not tokenize IP fixture"; exit 1)

          smoke_home="$(mktemp -d)"
          proxy_port="$(python3 - <<'PY'
          import socket
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )"
          export HOME="$smoke_home"
          trap '"$bin" proxy stop --force >/dev/null 2>&1 || true; rm -rf "$smoke_home"' EXIT
          # Capture `proxy status` stdout via $() instead of piping into `grep -q`.
          # grep -q closes stdin on first match → upstream gaze hits EPIPE on
          # the next println and the CLI panic hook emits {"error":"Pipeline","exit":3}.
          # The $() form lets gaze finish writing before grep inspects the result.
          # Underlying SIGPIPE tolerance is tracked as a v0.8.2 follow-up.
          status_out="$("$bin" proxy status)"; grep -q 'not running' <<< "$status_out"
          "$bin" proxy start --bind "127.0.0.1:$proxy_port"
          sleep 1
          status_out="$("$bin" proxy status)"; grep -q 'running' <<< "$status_out"
          "$bin" proxy restart --force
          sleep 1
          status_out="$("$bin" proxy status)"; grep -q 'running' <<< "$status_out"
          "$bin" proxy stop --force
          status_out="$("$bin" proxy status)"; grep -q 'not running' <<< "$status_out"

      - name: Smoke arm64 NER inference
        if: inputs.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/smoke/${{ inputs.artifact }}"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          "$bin" setup --non-interactive --safety-net none \
            --model-dir "$smoke_dir/ner" --policy-out "$smoke_dir/policy.toml"
          printf 'Dr. Schmidt wrote the letter.' | "$bin" clean \
            --rulepack-bundled core > "$smoke_dir/rules-only.json"
          python3 -c 'import json,sys; assert json.load(sys.stdin)["clean_text"] == "Dr. Schmidt wrote the letter."' < "$smoke_dir/rules-only.json"
          printf 'Dr. Schmidt wrote the letter.' | "$bin" clean \
            --policy "$smoke_dir/policy.toml" --rulepack-bundled core > "$smoke_dir/clean.json"
          python3 - "$smoke_dir/clean.json" "$smoke_dir/restore.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text())
          assert ':Name_' in result['clean_text'], result['clean_text']
          assert 'Schmidt' not in result['clean_text'], result['clean_text']
          Path(sys.argv[2]).write_text(json.dumps({
              'session_blob': result['session_blob'], 'text': result['clean_text'],
          }))
          PYTHON
          "$bin" restore < "$smoke_dir/restore.json" > "$smoke_dir/restored.json"
          python3 -c 'import json,sys; assert json.load(sys.stdin)["text"] == "Dr. Schmidt wrote the letter."' < "$smoke_dir/restored.json"

