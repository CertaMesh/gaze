[workspace]
members = [
    "crates/gaze",
    "crates/gaze-assembly",
    "crates/gaze-audit",
    "crates/gaze-recognizers",
    "crates/gaze-types",
    "crates/gaze-cli",
    "crates/xtask",
]
resolver = "2"

[workspace.dependencies]
gaze-audit = { path = "crates/gaze-audit", version = "0.6.2" }
gaze-types = { path = "crates/gaze-types", version = "0.6.2" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1" }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[workspace.metadata.dylint]
libraries = [{ path = "xtask/dylint" }]
