[package]
name = "gaze"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "GDPR-compliant debugging proxy between AI coding agents and production data"

[lib]
name = "gaze"
path = "src/lib.rs"

[dependencies]
rmcp = "0.2"
clap = { version = "4.5", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
ulid = "1"
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
fake = "2.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
anyhow = "1"
pii = { git = "https://github.com/worka-ai/pii", branch = "main" }
libc = "0.2"

[dev-dependencies]
proptest = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["mysql"] }
trybuild = "1"
tempfile = "3"
